<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 v2.5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','PingFang SC',sans-serif;
  height:100vh;display:flex;overflow:hidden;font-size:13px;
  background:linear-gradient(135deg,#dce8ff 0%,#e8d5f5 35%,#d5e8f5 65%,#ddf0e8 100%);
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 15%,rgba(147,197,253,0.5) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 80%,rgba(196,181,253,0.4) 0%,transparent 50%),
    radial-gradient(ellipse at 55% 5%,rgba(167,243,208,0.3) 0%,transparent 40%);
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes checkPop{0%{transform:scale(1)}35%{transform:scale(1.28)}70%{transform:scale(.91)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── SIDEBAR ── */
.sidebar{
  width:200px;min-width:200px;height:100vh;display:flex;flex-direction:column;z-index:10;position:relative;
  background:rgba(255,255,255,0.52);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  border-right:0.5px solid rgba(255,255,255,0.8);
}
.sb-head{padding:18px 14px 12px;border-bottom:0.5px solid rgba(0,0,0,0.06);}
.sb-brand{display:flex;align-items:baseline;gap:6px;}
.sb-title{font-size:15px;font-weight:700;color:#1a1a2e;letter-spacing:-0.4px;}
.sb-ver{font-size:10px;color:rgba(0,0,0,0.28);font-family:monospace;}
.sb-stats{display:flex;margin-top:11px;background:rgba(255,255,255,0.65);border-radius:10px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07);}
.sb-stat{flex:1;text-align:center;padding:7px 3px;border-right:0.5px solid rgba(0,0,0,0.06);}
.sb-stat:last-child{border-right:none;}
.sb-num{display:block;font-size:16px;font-weight:700;color:#1a1a2e;}
.sb-lbl{display:block;font-size:9px;color:rgba(0,0,0,0.35);margin-top:1px;}
.hm-wrap{padding:11px 14px 10px;}
.hm-lbl{font-size:9px;color:rgba(0,0,0,0.3);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;}
.hm{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:2.5px;}
.hm-c.today{outline:2px solid rgba(99,102,241,0.7);outline-offset:1px;}
.hm-c.hm-selected{outline:2px solid #ef4444;outline-offset:1px;transform:scale(1.2);}
.hm-c{aspect-ratio:1;border-radius:2px;background:rgba(0,0,0,0.07);}
.hm-c.l1{background:rgba(99,102,241,0.22);}
.hm-c.l2{background:rgba(99,102,241,0.5);}
.hm-c.l3{background:rgba(99,102,241,0.82);}
.sb-div{height:0.5px;background:rgba(0,0,0,0.07);margin:0 14px;}
.sb-nav{padding:7px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;color:rgba(0,0,0,0.45);transition:all .16s;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,0.6);color:rgba(0,0,0,0.75);}
.nav-item.active{background:rgba(255,255,255,0.78);color:#4338ca;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.nav-item i{font-size:15px;color:rgba(0,0,0,0.3);}
.nav-item.active i{color:#6366f1;}
.sb-sec-lbl{padding:11px 14px 4px;font-size:9px;color:rgba(0,0,0,0.28);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.sb-sec-lbl button{font-size:9px;color:rgba(0,0,0,0.35);background:none;border:none;cursor:pointer;padding:1px 5px;border-radius:4px;font-family:inherit;letter-spacing:0;}
.sb-sec-lbl button:hover{background:rgba(0,0,0,0.06);color:#4338ca;}
.tag-row{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11.5px;color:rgba(0,0,0,0.45);transition:all .14s;}
.tag-row:hover{background:rgba(255,255,255,0.55);color:rgba(0,0,0,0.75);}
.tag-row.active-tag{background:rgba(255,255,255,0.68);color:#4338ca;}
.tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tag-count{margin-left:auto;font-size:9px;color:rgba(0,0,0,0.22);}
.sb-footer{margin-top:auto;border-top:0.5px solid rgba(0,0,0,0.06);padding:9px 12px;}
/* heatmap tooltip + quick filters */
.hm-tip{font-size:9.5px;color:rgba(99,102,241,0.85);min-height:13px;margin:3px 0 5px;text-align:center;transition:opacity .15s;}
.hm-quick{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.hm-qbtn{font-size:9px;padding:2px 7px;border-radius:9px;border:0.5px solid rgba(0,0,0,0.1);background:rgba(0,0,0,0.04);color:rgba(0,0,0,0.45);cursor:pointer;font-family:inherit;transition:all .1s;}
.hm-qbtn:hover{background:rgba(99,102,241,0.07);color:#4338ca;}
.hm-qbtn.active{background:rgba(99,102,241,0.1);color:#4338ca;border-color:rgba(99,102,241,0.25);}
/* todo edit date picker */
.todo-date-field{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.todo-date-field label{font-size:11px;color:rgba(0,0,0,0.4);white-space:nowrap;}
.todo-date-inp{border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;padding:6px 10px;font-size:13px;color:#1a1a2e;background:rgba(255,255,255,0.7);font-family:inherit;outline:none;flex:1;transition:border-color .15s;}
.todo-date-inp:focus{border-color:rgba(99,102,241,0.5);box-shadow:0 0 0 2px rgba(99,102,241,0.1);}
/* date filter badge in topbar */
.date-filter-badge{display:none;font-size:11px;padding:2px 9px;border-radius:10px;background:rgba(99,102,241,0.1);color:#4338ca;border:0.5px solid rgba(99,102,241,0.2);margin-left:6px;cursor:pointer;}
.date-filter-badge.show{display:inline-flex;align-items:center;gap:4px;}
.sync-row{display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,0.2);flex-shrink:0;}
.sync-dot.ok{background:#22c55e;box-shadow:0 0 5px rgba(34,197,94,0.5);}
.sync-dot.err{background:#ef4444;}
.sync-dot.ing{background:#f59e0b;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.sync-text{font-size:10px;color:rgba(0,0,0,0.35);flex:1;}
.sync-cfg{font-size:10px;color:rgba(0,0,0,0.38);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;font-family:inherit;}
.sync-cfg:hover{background:rgba(0,0,0,0.05);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;z-index:1;position:relative;}
.topbar{
  padding:0 22px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:0.5px solid rgba(255,255,255,0.75);
}
.topbar-title{font-size:15px;font-weight:700;color:#1a1a2e;letter-spacing:-0.3px;}
.topbar-right{display:flex;align-items:center;gap:7px;}
.batch-btn{font-size:11.5px;color:rgba(0,0,0,0.45);background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.1);border-radius:8px;padding:5px 11px;cursor:pointer;font-family:inherit;transition:all .12s;}
.batch-btn:hover{background:rgba(255,255,255,0.8);color:#4338ca;}
.search-wrap{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.1);border-radius:8px;padding:5px 11px;min-width:140px;}
.search-wrap input{border:none;outline:none;background:none;font-size:12px;color:#1a1a2e;width:100%;font-family:inherit;}
.search-wrap input::placeholder{color:rgba(0,0,0,0.28);}

/* ── CAPTURE ── */
.capture{padding:14px 22px 8px;flex-shrink:0;}
.cap-card{
  background:rgba(255,255,255,0.65);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:0.5px solid rgba(255,255,255,0.9);border-radius:13px;padding:3px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.04);
  transition:box-shadow .2s,border-color .2s;
  display:flex;flex-direction:column;
}
.cap-card:focus-within{border-color:rgba(99,102,241,0.45);box-shadow:0 0 0 3px rgba(99,102,241,0.1),0 2px 12px rgba(0,0,0,0.08);}
.cap-input{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:13.5px;color:#1a1a2e;padding:10px 13px 7px;resize:none;line-height:1.55;min-height:44px;}
.cap-input::placeholder{color:rgba(0,0,0,0.25);}
.cap-bar{display:flex;align-items:center;gap:5px;padding:5px 9px;border-top:0.5px solid rgba(0,0,0,0.06);}
.cap-tag-btn{height:22px;padding:0 10px;border-radius:11px;border:0.5px solid rgba(0,0,0,0.1);background:rgba(0,0,0,0.04);font-size:11px;color:rgba(0,0,0,0.45);cursor:pointer;font-family:inherit;transition:all .12s;}
.cap-tag-btn:hover{background:rgba(99,102,241,0.08);border-color:rgba(99,102,241,0.25);color:#4f46e5;}
.cap-hint{font-size:10px;color:rgba(0,0,0,0.22);margin-left:3px;}
.cap-submit{margin-left:auto;height:27px;padding:0 15px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:13px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .12s,transform .1s;box-shadow:0 2px 8px rgba(99,102,241,0.3);}
.cap-submit:hover{opacity:.88;}
.cap-submit:active{transform:scale(.97);}
/* pending images strip */
.cap-imgs-strip{display:flex;gap:5px;flex-wrap:wrap;padding:4px 9px 2px;}
.cap-img-thumb{position:relative;width:48px;height:48px;}
.cap-img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;border:0.5px solid rgba(0,0,0,0.1);}
.cap-img-thumb button{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ef4444;color:white;border:none;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1;}

/* ── STREAM ── */
.stream{flex:1;overflow-y:auto;padding:4px 22px 16px;}
.date-sep{font-size:10px;color:rgba(0,0,0,0.28);margin:10px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.04em;text-transform:uppercase;}
.date-sep::after{content:'';flex:1;height:.5px;background:rgba(0,0,0,0.08);}

/* ── NOTE CARDS ── */
.card{
  background:rgba(255,255,255,0.62);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:0.5px solid rgba(255,255,255,0.9);border-radius:12px;padding:11px 13px;margin-bottom:7px;
  box-shadow:0 1px 4px rgba(0,0,0,0.05),0 4px 12px rgba(0,0,0,0.04);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,border-color .15s;
  animation:cardIn .28s cubic-bezier(.34,1.56,.64,1) both;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1),0 2px 6px rgba(0,0,0,0.06);border-color:rgba(255,255,255,1);}
.card-meta{display:flex;justify-content:space-between;margin-bottom:7px;}
.card-time{font-size:10px;color:rgba(0,0,0,0.3);font-family:monospace;}
.card-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;}
.card:hover .card-actions{opacity:1;}
.card-btn{background:none;border:0.5px solid rgba(0,0,0,0.12);border-radius:20px;padding:2px 8px;font-size:10px;cursor:pointer;color:rgba(0,0,0,0.4);transition:all .1s;font-family:inherit;}
.card-btn:hover{background:rgba(0,0,0,0.05);color:rgba(0,0,0,0.75);}
.card-btn.to-todo{color:#0369a1;border-color:rgba(14,165,233,0.3);}
.card-btn.to-todo:hover{background:rgba(14,165,233,0.08);}
.card-btn.to-exp{color:#047857;border-color:rgba(16,185,129,0.3);}
.card-btn.to-exp:hover{background:rgba(16,185,129,0.08);}
.card-body{font-size:13px;color:rgba(0,0,0,0.78);line-height:1.75;word-break:break-word;cursor:default;}
.card-body.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-body[contenteditable="true"]{outline:none;cursor:text;overflow-y:auto;max-height:60vh;}
.card-expand-btn{display:none;margin-top:5px;font-size:11px;color:#6366f1;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}
.card-expand-btn.show{display:inline-block;}
.card-expand-btn:hover{color:#4338ca;text-decoration:underline;}
.card-body a{color:#4f46e5;text-decoration:underline;text-underline-offset:2px;}
.card-body a:hover{color:#4338ca;}
.card-body h1{font-size:17px;font-weight:500;margin:6px 0 4px;color:rgba(0,0,0,0.88);}
.card-body h2{font-size:15px;font-weight:500;margin:5px 0 3px;color:rgba(0,0,0,0.84);}
.card-body h3{font-size:13.5px;font-weight:500;margin:4px 0 3px;color:rgba(0,0,0,0.82);}
.card-body ul,.card-body ol{margin:4px 0 4px 4px;font-size:13px;padding-left:20px;list-style-position:outside;}
.card-body ol{list-style-type:decimal;}
/* color picker swatch */
.color-swatch{width:16px;height:16px;border-radius:3px;border:0.5px solid rgba(0,0,0,0.15);cursor:pointer;display:inline-block;flex-shrink:0;}
.color-picker-wrap{position:relative;display:inline-flex;align-items:center;}
.color-picker-wrap input[type=color]{opacity:0;position:absolute;width:16px;height:16px;cursor:pointer;border:none;}
/* note-toolbar — fixed to top of card when editing */
.card.editing{outline:2px solid rgba(99,102,241,0.25);outline-offset:-1px;}
/* global note toolbar — fixed below topbar/sync-strip */
.global-note-toolbar{display:none;align-items:center;gap:2px;padding:5px 22px;flex-wrap:wrap;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(0,0,0,0.07);flex-shrink:0;}
.global-note-toolbar.show{display:flex;}
/* todo edit modal */
.todo-edit-modal{width:600px;}
.todo-edit-title{width:100%;border:none;border-bottom:1.5px solid #6366f1;outline:none;font-size:15px;font-weight:500;color:#1a1a2e;background:transparent;font-family:inherit;padding:4px 0 6px;margin-bottom:14px;}
.todo-edit-remark{min-height:100px;border:0.5px solid rgba(0,0,0,0.12);border-radius:8px;padding:10px 12px;font-size:13px;color:#1a1a2e;line-height:1.75;outline:none;word-break:break-word;background:rgba(255,255,255,0.7);}
.todo-edit-remark:empty:before{content:"添加备注…";color:rgba(0,0,0,0.25);pointer-events:none;}
.todo-edit-remark a{color:#4f46e5;text-decoration:underline;text-underline-offset:2px;}
.remark-toolbar{display:flex;align-items:center;gap:2px;padding:4px 8px;border:0.5px solid rgba(0,0,0,0.12);border-bottom:none;border-radius:8px 8px 0 0;background:rgba(0,0,0,0.02);flex-wrap:wrap;}
.remark-toolbar+.todo-edit-remark{border-radius:0 0 8px 8px;}
.rt-btn{width:22px;height:22px;border-radius:3px;border:none;background:none;font-size:11px;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500;transition:all .1s;}
.rt-btn:hover{background:rgba(0,0,0,0.06);color:rgba(0,0,0,0.8);}
.rt-sep{width:0.5px;height:12px;background:rgba(0,0,0,0.1);margin:0 2px;}
.card-body blockquote{border-left:3px solid #6366f1;border-radius:0;padding:5px 12px;background:rgba(99,102,241,0.05);margin:5px 0;color:rgba(0,0,0,0.6);font-size:12.5px;line-height:1.65;}
.card-body pre{background:rgba(0,0,0,0.04);border:0.5px solid rgba(0,0,0,0.08);border-radius:6px;padding:8px 12px;font-family:monospace;font-size:11.5px;overflow-x:auto;margin:5px 0;white-space:pre-wrap;}
.card-body mark{background:#fef08a;color:#713f12;border-radius:2px;padding:0 2px;}
.card-body mark.green{background:#bbf7d0;color:#14532d;}
/* note toolbar */
.note-toolbar{display:none;} .note-toolbar.show{display:none;}
.nt-btn{width:24px;height:24px;border-radius:4px;border:none;background:none;font-size:11px;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500;transition:all .1s;}
.nt-btn:hover{background:rgba(0,0,0,0.06);color:rgba(0,0,0,0.8);}
.nt-sep{width:0.5px;height:14px;background:rgba(0,0,0,0.1);margin:0 2px;}
.nt-select{font-size:10px;padding:2px 4px;border-radius:4px;border:0.5px solid rgba(0,0,0,0.12);background:transparent;color:rgba(0,0,0,0.6);height:22px;cursor:pointer;}
/* capture note toolbar */
.cap-toolbar{display:flex;align-items:center;gap:2px;padding:5px 9px;border-bottom:0.5px solid rgba(0,0,0,0.05);flex-wrap:wrap;}
.ct-btn{width:24px;height:24px;border-radius:4px;border:none;background:none;font-size:11px;color:rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500;transition:all .1s;}
.ct-btn:hover{background:rgba(0,0,0,0.06);color:rgba(0,0,0,0.8);}
.ct-sep{width:0.5px;height:14px;background:rgba(0,0,0,0.1);margin:0 2px;}
.ct-select{font-size:10px;padding:2px 4px;border-radius:4px;border:0.5px solid rgba(0,0,0,0.12);background:transparent;color:rgba(0,0,0,0.6);height:22px;cursor:pointer;}
.cap-edit{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:13.5px;color:#1a1a2e;padding:10px 13px 7px;min-height:60px;max-height:220px;overflow-y:auto;line-height:1.75;word-break:break-word;}
.cap-edit:empty:before{content:attr(data-placeholder);color:rgba(0,0,0,0.25);pointer-events:none;}
.card-tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.note-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.note-img-wrap{position:relative;}
.note-img{width:70px;height:70px;object-fit:cover;border-radius:6px;border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;transition:opacity .1s;}
.note-img:hover{opacity:.82;}
.note-img-del{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:white;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,0.05);color:rgba(0,0,0,0.45);border:0.5px solid rgba(0,0,0,0.08);}
/* upload progress */
.upload-badge{font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(99,102,241,0.1);color:#4338ca;border:0.5px solid rgba(99,102,241,0.2);margin-left:4px;}

/* ── TODOS ── */
.todo-wrap{
  background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:0.5px solid rgba(255,255,255,0.88);border-radius:12px;overflow:hidden;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.05),0 4px 12px rgba(0,0,0,0.04);
}
.todo-row{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-bottom:0.5px solid rgba(0,0,0,0.05);transition:background .12s;animation:cardIn .25s cubic-bezier(.34,1.56,.64,1) both;position:relative;}
.todo-row:last-child{border-bottom:none;}
.todo-row:hover{background:rgba(255,255,255,0.45);}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<script>
/* ── TAGS (dynamic) ── */
let TAGS=[
  {id:'auth',label:'#认证',color:'#0ea5e9'},
  {id:'arch',label:'#架构',color:'#8b5cf6'},
  {id:'db',label:'#数据库',color:'#f59e0b'},
  {id:'design',label:'#设计',color:'#10b981'},
  {id:'ops',label:'#运维',color:'#ef4444'},
  {id:'mgmt',label:'#管理',color:'#6366f1'},
];

/* ── GH FILE NAMES ── */
const GH_FILES={
  notes:'notes.json',
  todos:'todos.json',
  experiences:'experiences.json',
  tags:'tags.json'
};
/* sha cache per file */
let _sha={notes:null,todos:null,experiences:null,tags:null};
let _syncTimer=null;
let _pulling=false;
let _pushing=false;
/* dirty flags — only push files that actually changed */
let _dirty={notes:false,todos:false,experiences:false,tags:false};

let notes=[];
let todos=[];
let experiences=[];

let mode='todos',activeTag=null,expFilter='all',searchText='';
let pendingTagTarget=null,pendingSelTags=[];
let pendingExpNoteId=null,pendingExpType='lesson';
let addingChainFor=null,batchSel={};
/* pending images for compose (base64 before upload) */
let composePendingImgs=[];
/* pending images for todo compose */
let todoPendingImgs=[];
/* link insert target: 'note-compose'|'todo-compose'|{type,id} */
let _linkTarget=null;

/* ── UTILS ── */
function uid(){return String(Date.now())+String(Math.floor(Math.random()*9000+1000));}
function todayISO(){return new Date().toISOString().slice(0,10);}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getTag(id){return TAGS.find(t=>t.id===id);}
function tagLabel(id){const t=getTag(id);return t?t.label:'#'+id;}
function tagColor(id){const t=getTag(id);return t?t.color:'#888';}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ── UPLOAD PROGRESS ── */
function upShow(label){
  document.getElementById('up-label').textContent=label||'上传中…';
  document.getElementById('up-bar').style.width='0%';
  document.getElementById('up-overlay').classList.add('open');
}
function upProgress(pct){document.getElementById('up-bar').style.width=pct+'%';}
function upHide(){document.getElementById('up-overlay').classList.remove('open');}

/* ── LOCAL DATA ── */
function loadLocal(){
  try{
    const r=localStorage.getItem('wb_v22');
    if(r){
      const d=JSON.parse(r);
      if(d.notes)notes=d.notes;
      if(d.todos)todos=d.todos;
      if(d.experiences)experiences=d.experiences;
      if(d.tags)TAGS=d.tags;
    }
  }catch(e){}
}
function saveLocal(){
  localStorage.setItem('wb_v22',JSON.stringify({notes,todos,experiences,tags:TAGS}));
}
/* granular save — mark only the changed dataset dirty */
function saveNotes(){saveLocal();_dirty.notes=true;schedulePush();}
function saveTodos(){saveLocal();_dirty.todos=true;schedulePush();}
function saveExp(){saveLocal();_dirty.experiences=true;schedulePush();}
function saveTags(){saveLocal();_dirty.tags=true;schedulePush();}
/* save() marks everything dirty — used when multiple datasets change at once */
function save(){saveLocal();_dirty.notes=true;_dirty.todos=true;_dirty.experiences=true;_dirty.tags=true;schedulePush();}

/* ── GITHUB MULTI-FILE ── */
function ghCfg(){try{return JSON.parse(localStorage.getItem('wb_gh')||'null');}catch(e){return null;}}
function ghConfigured(){const c=ghCfg();return !!(c&&c.token&&c.owner&&c.repo);}
function ghHeaders(){
  const c=ghCfg();
  const auth=c.token.startsWith('github_pat_')?'Bearer '+c.token:'token '+c.token;
  return{'Authorization':auth,'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
}
function ghFileUrl(name){
  const c=ghCfg();
  return'https://api.github.com/repos/'+c.owner.trim()+'/'+c.repo.trim()+'/contents/'+name;
}
function ghImgUrl(path){
  const c=ghCfg();
  return'https://api.github.com/repos/'+c.owner.trim()+'/'+c.repo.trim()+'/contents/'+path;
}

/* ── SYNC TOP BAR ── */
let _topbarTimer=null;
function syncBarStart(){
  const strip=document.getElementById('sync-strip');
  const bar=document.getElementById('sync-strip-bar');
  const lbl=document.getElementById('sync-strip-label');
  if(!strip)return;
  clearTimeout(_topbarTimer);
  strip.className='sync-strip active';
  if(lbl){lbl.className='sync-strip-label ing';lbl.textContent='同步中…';}
  if(bar){bar.style.background='#6366f1';bar.style.width='0%';requestAnimationFrame(()=>{bar.style.width='80%';});}
}
function syncBarDone(ok){
  const strip=document.getElementById('sync-strip');
  const bar=document.getElementById('sync-strip-bar');
  const lbl=document.getElementById('sync-strip-label');
  if(!strip)return;
  if(bar){bar.style.width='100%';bar.style.background=ok?'#22c55e':'#ef4444';}
  if(lbl){lbl.className='sync-strip-label '+(ok?'ok':'err');lbl.textContent=ok?'✓ 已保存':'✕ 同步失败';}
  strip.className='sync-strip done';
  clearTimeout(_topbarTimer);
  _topbarTimer=setTimeout(()=>{
    strip.classList.add('fade');
    setTimeout(()=>{strip.className='sync-strip';if(bar)bar.style.width='0%';},300);
  },1200);
}

function setSyncStatus(state,msg){
  const dot=document.getElementById('sync-dot'),txt=document.getElementById('sync-text');
  if(dot)dot.className='sync-dot'+(state?' '+state:'');
  if(txt)txt.textContent=msg||'未配置同步';
}

/* push one json file */
async function ghPushFile(name,data){
  /* 如果 SHA 缓存为空（页面刷新后），先 GET 拿最新 SHA，避免 409 冲突 */
  if(!_sha[name]){
    try{
      const chk=await fetch(ghFileUrl(GH_FILES[name]),{headers:ghHeaders()});
      if(chk.ok){const j=await chk.json();_sha[name]=j.sha;}
    }catch(e){}
  }
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const body={message:'sync '+name+' '+new Date().toISOString(),content};
  if(_sha[name])body.sha=_sha[name];
  const r=await fetch(ghFileUrl(GH_FILES[name]),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.message||'HTTP '+r.status);}
  const j=await r.json();_sha[name]=j.content.sha;
}

/* pull one json file */
async function ghPullFile(name){
  const r=await fetch(ghFileUrl(GH_FILES[name]),{headers:ghHeaders()});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();_sha[name]=j.sha;
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
}

/* upload image file to images/ dir, returns raw URL */
async function ghUploadImage(path,base64Data){
  /* base64Data is dataURL, strip prefix */
  const b64=base64Data.split(',')[1];
  const body={message:'img '+path,content:b64};
  /* check if exists to get sha */
  try{
    const chk=await fetch(ghImgUrl(path),{headers:ghHeaders()});
    if(chk.ok){const j=await chk.json();body.sha=j.sha;}
  }catch(e){}
  const r=await fetch(ghImgUrl(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.message||'HTTP '+r.status);}
  const c=ghCfg();
  return'https://raw.githubusercontent.com/'+c.owner.trim()+'/'+c.repo.trim()+'/main/'+path;
}

async function ghPushAll(){
  if(!ghConfigured())return;
  if(_pulling||_pushing)return;
  const toSync=Object.keys(_dirty).filter(k=>_dirty[k]);
  if(!toSync.length)return;
  _pushing=true;
  syncBarStart();
  setSyncStatus('ing','同步中…');
  const dataMap={notes,todos,experiences,tags:TAGS};
  const total=toSync.length;
  let done=0;
  try{
    /* serial push per file — avoid SHA conflicts */
    for(const name of toSync){
      await ghPushFile(name,dataMap[name]);
      _dirty[name]=false;
      done++;
      const pct=20+Math.round((done/total)*75);
      const _bar=document.getElementById('sync-strip-bar');if(_bar)_bar.style.width=pct+'%';
    }
    const t=new Date();
    setSyncStatus('ok','已同步 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0'));
    syncBarDone(true);
  }catch(e){
    setSyncStatus('err','同步失败: '+e.message);
    syncBarDone(false);
  }finally{_pushing=false;}
}

async function ghPullAll(){
  if(!ghConfigured())return;
  _pulling=true;
  setSyncStatus('ing','加载中…');
  try{
    const [rn,rt,re,rtags]=await Promise.all([
      ghPullFile('notes'),ghPullFile('todos'),ghPullFile('experiences'),ghPullFile('tags')
    ]);
    if(rn)notes=rn;
    if(rt)todos=rt;
    if(re)experiences=re;
    if(rtags&&Array.isArray(rtags))TAGS=rtags;
    /* if any file missing, push it */
    if(!rn||!rt||!re||!rtags)await ghPushAll();
    saveLocal();renderAll();setSyncStatus('ok','已从云端加载');
  }catch(e){setSyncStatus('err','读取失败: '+e.message);}
  finally{_pulling=false;}
}

function schedulePush(){
  if(_pulling)return; /* pull 未完成时不触发 push，避免 SHA 冲突 */
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(ghPushAll,1500);
}

/* ── IMAGE UPLOAD HELPERS ── */
async function uploadImagesParallel(imgList,prefix){
  /* imgList: array of base64 dataURLs, prefix e.g. 'images/note_ID' */
  /* returns array of raw URLs */
  const tasks=imgList.map((b64,i)=>{
    const ext='jpg';
    const path=prefix+'_'+i+'.'+ext;
    return ghUploadImage(path,b64);
  });
  return Promise.all(tasks);
}

/* ── COMPRESS IMAGE ── */
function compressImg(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');let w=img.width,h=img.height,MAX=1200;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      const d=canvas.toDataURL('image/jpeg',0.75);
      cb(d);
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

/* ── RENDER RICH TEXT (links) ── */
/* text format: plain text with [[text|url]] markers */
function renderRichText(text){
  if(!text)return'';
  return esc(text).replace(/\[\[(.+?)\|(.+?)\]\]/g,(_,t,u)=>{
    const safeUrl=u.startsWith('http')?u:'https://'+u;
    return'<a href="'+esc(safeUrl)+'" target="_blank" rel="noopener">'+t+'</a>';
  });
}

/* ── IMG PASTE ── */
function handleImgPasteCompose(e,target){
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(let i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')!==-1){
      e.preventDefault();
      compressImg(items[i].getAsFile(),d=>{
        if(target==='note'){
          composePendingImgs.push(d);
          renderImgsStrip('note-imgs-strip',composePendingImgs,'note');
        }else{
          todoPendingImgs.push(d);
          renderImgsStrip('todo-imgs-strip',todoPendingImgs,'todo');
        }
        toast('图片已附加，发送时上传');
      });
      return;
    }
  }
}
function renderImgsStrip(stripId,arr,type){
  const el=document.getElementById(stripId);if(!el)return;
  if(!arr.length){el.innerHTML='';return;}
  el.innerHTML=arr.map((b64,i)=>`<div class="cap-img-thumb">
    <img src="${b64}" />
    <button onclick="removePendingImg('${type}',${i})">×</button>
  </div>`).join('');
}
function removePendingImg(type,idx){
  if(type==='note'){composePendingImgs.splice(idx,1);renderImgsStrip('note-imgs-strip',composePendingImgs,'note');}
  else{todoPendingImgs.splice(idx,1);renderImgsStrip('todo-imgs-strip',todoPendingImgs,'todo');}
}

/* paste into existing note card */
function handleImgPaste(e,noteId){
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(let i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')!==-1){
      e.preventDefault();
      compressImg(items[i].getAsFile(),async d=>{
        const n=notes.find(x=>String(x.id)===String(noteId));if(!n)return;
        if(!n.images)n.images=[];
        if(ghConfigured()){
          upShow('上传图片…');
          try{
            const url=await ghUploadImage('images/note_'+noteId+'_'+Date.now()+'.jpg',d);
            n.images.push(url);
          }catch(err){toast('图片上传失败: '+err.message);}
          upHide();
        }else{
          n.images.push(d);
        }
        saveNotes();renderNotes(document.getElementById('stream'));toast('图片已添加');
      });
      return;
    }
  }
}

  const el=document.getElementById('nb-'+id);if(!el)return;
  const n=notes.find(x=>String(x.id)===String(id));if(!n)return;

  el.contentEditable='true';el.focus();

function gntSave(){
  if(!_editingNoteId)return;
  const id=_editingNoteId;
  const card=document.getElementById('note-'+id);
  const el=document.getElementById('nb-'+id);if(!el){_editingNoteId=null;return;}
  const n=notes.find(x=>String(x.id)===String(id));if(n){n.html=el.innerHTML;n.text=el.textContent.trim();}
  el.contentEditable='false';
  el.classList.add('collapsed');
  if(card)card.classList.remove('editing');
  document.getElementById('global-note-toolbar').classList.remove('show');
  _editingNoteId=null;
  /* re-check if expand button needed */
  const btn=document.getElementById('nexp-'+id);

    btn.style.display='';
    btn.textContent='展开 ↓';
    setTimeout(()=>{if(el.scrollHeight>el.clientHeight+4)btn.classList.add('show');else btn.classList.remove('show');},0);

function gntCancel(){
  if(!_editingNoteId)return;
  const id=_editingNoteId;
  const card=document.getElementById('note-'+id);
  const el=document.getElementById('nb-'+id);
  if(el){const n=notes.find(x=>String(x.id)===String(id));if(n)el.innerHTML=noteBodyHTML(n);el.contentEditable='false';el.classList.add('collapsed');}
  if(card)card.classList.remove('editing');

  if(btn){btn.style.display='';btn.textContent='展开 ↓';setTimeout(()=>{if(el&&el.scrollHeight>el.clientHeight+4)btn.classList.add('show');else btn.classList.remove('show');},0);}
  _editingNoteId=null;

/* ── TODOS RENDER ── */
function applyTodoDateFilter(list){
  const tk=todayKey();
  if(_hmSelectedDate){
    return list.filter(t=>t.isoDate===_hmSelectedDate);
  }
  const qf=window._hmQuickFilter;
  if(qf==='today') return list.filter(t=>t.isoDate===tk);
  if(qf==='week'){
    const d=new Date();const dow=d.getDay()||7;
    const mon=new Date(d);mon.setDate(d.getDate()-dow+1);
    const monK=mon.toISOString().slice(0,10);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const sunK=sun.toISOString().slice(0,10);
    return list.filter(t=>t.isoDate&&t.isoDate>=monK&&t.isoDate<=sunK);
  }
  if(qf==='overdue') return list.filter(t=>t.isoDate&&t.isoDate<tk&&!t.done);
  return list;
}
function renderTodos(s){
  let base=todos.filter(t=>(!activeTag||t.tags.includes(activeTag))&&matchSearch(t.text,t.tags));
  let pending=applyTodoDateFilter(base.filter(t=>!t.done));
  let done=applyTodoDateFilter(base.filter(t=>t.done));
  pending.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  const isFiltered=!!(_hmSelectedDate||window._hmQuickFilter);
  let html='<div class="todo-wrap">';
  if(!pending.length)html+='<div style="padding:14px 13px;font-size:12px;color:rgba(0,0,0,0.3)">'+(isFiltered?'该日期没有待办任务':'今天的任务都完成了 🎉')+'</div>';
  else html+=renderChainedTodos(pending);
  html+=`</div>`;
  if(done.length){html+='<div class="sec-done">已完成</div><div class="todo-wrap">'+done.map(todoRowHTML).join('')+'</div>';}
  s.innerHTML=html;
}
function renderChainedTodos(list){
  let html='';
  list.forEach(t=>{
    html+=todoRowHTML(t);
    if(t.nextId&&list.find(x=>String(x.id)===String(t.nextId))){
      html+=`<div class="chain-connector"><div class="chain-line${t.done?' unlocked':''}"></div><span class="chain-label">${t.done?'↓ 已解锁':'↓ 完成后解锁'}</span></div>`;
    }
    if(String(addingChainFor)===String(t.id)){
      html+=`<div class="chain-add-area">
        <div class="chain-add-label">完成后自动触发下一步：</div>
        <div class="chain-add-row">
          <input class="chain-add-input" id="chain-inp" placeholder="下一步做什么..." />
          <button class="chain-add-ok" onclick="confirmChainAdd('${t.id}')">确定</button>
          <button class="chain-add-cancel" onclick="cancelChainAdd()">取消</button>
        </div></div>`;
    }
  });
  return html;
}
function todoRowHTML(t){
  const isNext=!t.done&&!t.locked&&todos.some(x=>String(x.nextId)===String(t.id)&&x.done);
  let badge='';
  if(t.done&&t.nextId)badge='<span class="badge-chain">已触发</span>';
  else if(isNext)badge='<span class="badge-next">轮到你了</span>';
  else if(t.locked)badge='<span class="badge-lock">等待前置</span>';
  const imgsHtml=(t.images&&t.images.length)?`<div class="todo-imgs">${t.images.map((img,i)=>`<div class="todo-img-wrap"><img src="${img}" class="todo-img" onclick="previewImg('${img}')" /><button class="todo-img-del" onclick="deleteTodoImg('${t.id}',${i})">×</button></div>`).join('')}</div>`:'';
  /* remark preview — first line only, click opens modal */
  const remark=t.remark||'';
  const remarkHtml=remark?`<div class="todo-remark-preview has-remark" onclick="openTodoEditModal('${t.id}')">${esc(remark.split('\n')[0])}</div>`:'';
  const dblHandler=t.done||t.locked?'':(`openTodoEditModal('${t.id}')`);
  return`<div class="todo-row${t.pinned&&!t.done?' pinned':''}${isNext?' active-next':''}" id="tr-${t.id}">
    <div class="todo-circle${t.done?' done':t.locked?' locked':''}" onclick="${t.locked?`toast('需先完成前置任务')`:`toggleTodo('${t.id}')`}"></div>
    <div class="todo-body" ondblclick="${dblHandler}" style="${t.done||t.locked?'':'cursor:pointer;'}" title="${t.done||t.locked?'':'双击编辑'}">
      <div class="todo-title${t.done?' done':t.locked?' locked-t':''}" id="tt-${t.id}">${renderRichText(t.text)}${t.pinned&&!t.done?' <span style="font-size:10px;opacity:0.5">📌</span>':''}</div>
      <div class="todo-sub">
        <span class="todo-date">${t.date}</span>
        ${t.tags.map(tg=>`<span class="todo-tag-pill" style="color:${tagColor(tg)}">${tagLabel(tg)}</span>`).join('')}
        ${badge}
      </div>
      ${imgsHtml}
      ${remarkHtml}
    </div>
    <div class="todo-actions">
      ${!t.done&&!t.locked?`<button class="t-btn chain-btn" onclick="startChainAdd('${t.id}')">+ 接下一步</button>`:''}
      ${!t.done?`<button class="t-btn${t.pinned?' pin-active':''}" onclick="togglePin('${t.id}')">${t.pinned?'取消置顶':'📌 置顶'}</button>`:''}
      <button class="t-btn" onclick="openTagModal('todo','${t.id}')">标签</button>
      <button class="t-btn" onclick="deleteTodo('${t.id}')" style="color:#ef4444">删除</button>
    </div>
  </div>`;
}

/* ── HEATMAP FILTER STATE ── */
let _hmSelectedDate=null;

function todayKey(){return new Date().toISOString().slice(0,10);}
function isoToDate(s){return new Date(s+'T00:00:00');}

function renderHeatmap(){
  const h=document.getElementById('heatmap');if(!h)return;
  const DAYS=70;
  /* count by type per day */
  const cntN={},cntT={},cntE={};
  notes.forEach(item=>{if(item.isoDate)cntN[item.isoDate]=(cntN[item.isoDate]||0)+1;});
  todos.forEach(item=>{if(item.isoDate)cntT[item.isoDate]=(cntT[item.isoDate]||0)+1;});
  experiences.forEach(item=>{if(item.isoDate)cntE[item.isoDate]=(cntE[item.isoDate]||0)+1;});
  const today=new Date();
  const tk=todayKey();
  /* find start: go back to most recent Monday */
  const dayOfWeek=today.getDay()||7; /* 1=Mon..7=Sun */
  const start=new Date(today);start.setDate(today.getDate()-dayOfWeek+1-(Math.ceil(DAYS/7)-1)*7);
  h.innerHTML='';
  const totalCells=10*7;
  for(let i=0;i<totalCells;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const future=d>today;
    const n=(cntN[key]||0)+(cntT[key]||0)+(cntE[key]||0);
    const lvl=future?0:n===0?0:n<=1?1:n<=3?2:3;
    const c=document.createElement('div');
    c.className='hm-c'+(future?' l0':' l'+lvl);
    if(key===tk)c.classList.add('today');
    if(key===_hmSelectedDate)c.classList.add('hm-selected');
    c.dataset.key=key;
    if(!future){
      c.style.cursor='pointer';
      c.addEventListener('mouseenter',()=>{
        const nn=cntN[key]||0,nt=cntT[key]||0,ne=cntE[key]||0;
        const mm=(d.getMonth()+1)+'月'+d.getDate()+'日';
        const tip=document.getElementById('hm-tip');
        if(tip)tip.textContent=mm+'  笔记 '+nn+' · 待办 '+nt+' · 经验 '+ne;
      });
      c.addEventListener('mouseleave',()=>{
        const tip=document.getElementById('hm-tip');
        if(tip)tip.textContent=_hmSelectedDate?formatHMDate(_hmSelectedDate)+' 筛选中':'';
      });
      c.addEventListener('click',()=>hmSelectDate(key));
    }
    h.appendChild(c);
  }
}

function formatHMDate(k){
  const d=isoToDate(k);
  return(d.getMonth()+1)+'月'+d.getDate()+'日';
}

function hmSelectDate(key){
  _hmSelectedDate=key;
  document.querySelectorAll('.hm-qbtn').forEach(b=>b.classList.remove('active'));
  renderHeatmap();
  const tip=document.getElementById('hm-tip');
  if(tip)tip.textContent=formatHMDate(key)+' 筛选中';
  const badge=document.getElementById('date-filter-badge');
  if(badge){badge.textContent='📅 '+formatHMDate(key)+' ×';badge.classList.add('show');}
  if(mode==='todos')renderTodos(document.getElementById('stream'));
}

function hmFilter(type){
  _hmSelectedDate=null;
  document.querySelectorAll('.hm-qbtn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('hmq-'+type);if(btn)btn.classList.add('active');
  const badge=document.getElementById('date-filter-badge');
  const tip=document.getElementById('hm-tip');
  if(badge)badge.classList.remove('show');
  if(tip)tip.textContent='';
  /* store quick filter */
  window._hmQuickFilter=type==='all'?null:type;
  renderHeatmap();
  if(mode==='todos')renderTodos(document.getElementById('stream'));
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();spOpen();return;}
  if(e.key==='Escape'){
    if(document.getElementById('search-panel').classList.contains('open')){spClose();return;}
    ['tag','tagmgr','link','exp','batch','sync'].forEach(n=>{document.getElementById('modal-'+n).classList.remove('open');});
    closeTodoEditModal();closeImgPreview();
    if(_editingNoteId)gntCancel();
  }
});

/* ── SEARCH PANEL ── */
let _spIdx=-1;
function spOpen(){
  document.getElementById('search-panel').classList.add('open');
  const inp=document.getElementById('sp-input');
  if(inp){inp.focus();inp.select();}
  spSearch();
}
function spClose(){
  document.getElementById('search-panel').classList.remove('open');
  _spIdx=-1;
}
function spHL(text,q){
  if(!q||!text)return esc(text||'');
  const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp('('+safe+')','gi'),'<mark>$1</mark>');
}
function spSearch(){
  const q=(document.getElementById('sp-input').value||'').trim().toLowerCase();
  const body=document.getElementById('sp-body');
  if(!q){body.innerHTML='<div class="sp-empty">输入关键词搜索笔记、待办、经验</div>';return;}
  const rn=notes.filter(n=>((n.text||'')+(n.html||'')).toLowerCase().includes(q)||(n.tags||[]).some(t=>tagLabel(t).toLowerCase().includes(q)));
  const rt=todos.filter(t=>((t.text||'')+(t.remark||'')).toLowerCase().includes(q)||(t.tags||[]).some(t2=>tagLabel(t2).toLowerCase().includes(q)));
  const re=experiences.filter(e=>((e.title||'')+(e.body||'')).toLowerCase().includes(q)||(e.tags||[]).some(t=>tagLabel(t).toLowerCase().includes(q)));
  if(!rn.length&&!rt.length&&!re.length){body.innerHTML='<div class="sp-empty">没有找到「'+esc(q)+'」相关内容</div>';return;}
  let html='';
  if(rt.length){
    html+='<div class="sp-group"><div class="sp-group-lbl"><i class="ti ti-checkbox" style="font-size:11px;color:#4338ca;" aria-hidden="true"></i>待办任务 · '+rt.length+'</div>';
    html+=rt.slice(0,5).map(t=>{
      const tid=String(t.id);
      return '<div class="sp-item" data-sp data-type="todo" data-id="'+tid+'"><div class="sp-icon todo"><i class="ti ti-checkbox" style="font-size:13px" aria-hidden="true"></i></div><div class="sp-content"><div class="sp-title">'+spHL(t.text,q)+'</div><div class="sp-meta">'+esc(t.date)+(t.remark?' · '+spHL(t.remark.slice(0,40),q):'')+'</div></div><span class="sp-badge todo">待办</span></div>';
    }).join('');
    html+='</div>';
  }
  if(rn.length){
    html+='<div class="sp-group"><div class="sp-group-lbl"><i class="ti ti-notes" style="font-size:11px;color:#0369a1;" aria-hidden="true"></i>全部笔记 · '+rn.length+'</div>';
    html+=rn.slice(0,5).map(n=>{
      const nid=String(n.id);
      return '<div class="sp-item" data-sp data-type="note" data-id="'+nid+'"><div class="sp-icon note"><i class="ti ti-notes" style="font-size:13px" aria-hidden="true"></i></div><div class="sp-content"><div class="sp-title">'+spHL((n.text||'').slice(0,40),q)+'</div><div class="sp-meta">'+esc(n.date)+' '+esc(n.time)+'</div></div><span class="sp-badge note">笔记</span></div>';
    }).join('');
    html+='</div>';
  }
  if(re.length){
    html+='<div class="sp-group"><div class="sp-group-lbl"><i class="ti ti-bulb" style="font-size:11px;color:#047857;" aria-hidden="true"></i>经验库 · '+re.length+'</div>';
    html+=re.slice(0,5).map(e=>{
      const eid=String(e.id);
      return '<div class="sp-item" data-sp data-type="exp" data-id="'+eid+'"><div class="sp-icon exp"><i class="ti ti-bulb" style="font-size:13px" aria-hidden="true"></i></div><div class="sp-content"><div class="sp-title">'+spHL(e.title,q)+'</div><div class="sp-meta">'+spHL((e.body||'').slice(0,50),q)+'</div></div><span class="sp-badge exp">经验</span></div>';
    }).join('');
    html+='</div>';
  }
  body.innerHTML=html;
  _spIdx=-1;
  body.querySelectorAll('[data-sp]').forEach(el=>{
    el.addEventListener('click',()=>spJump(el.dataset.type,el.dataset.id));
  });
}
function spJump(type,id){
  spClose();
  if(type==='todo'){
    switchMode('todos');
    setTimeout(()=>{const el=document.getElementById('tr-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},120);
  }else if(type==='note'){
    switchMode('notes');
    setTimeout(()=>{const el=document.getElementById('note-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},120);
  }else if(type==='exp'){
    switchMode('exp');
  }
}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('search-panel').classList.contains('open'))return;
  const items=[...document.querySelectorAll('[data-sp]')];
  if(e.key==='ArrowDown'){e.preventDefault();_spIdx=Math.min(_spIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('sp-active',i===_spIdx));}
  else if(e.key==='ArrowUp'){e.preventDefault();_spIdx=Math.max(_spIdx-1,0);items.forEach((el,i)=>el.classList.toggle('sp-active',i===_spIdx));}
  else if(e.key==='Enter'&&_spIdx>=0){e.preventDefault();if(items[_spIdx])items[_spIdx].click();}
},true);

/* ── INIT ── */
loadLocal();
if(ghConfigured()){setSyncStatus('ing','连接中…');ghPullAll().then(()=>renderAll());}
else{
  if(!localStorage.getItem('wb_v22')&&!localStorage.getItem('wb_seen')){
    localStorage.setItem('wb_seen','1');setTimeout(()=>openModal('sync'),800);
  }
  renderAll();
}
renderSidebarTags();
</script>
