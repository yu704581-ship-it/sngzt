<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>工作台 v3</title>
<style>
/* ══════════════════════════════════════════
   RESET & ROOT
══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f0f4fa;--bg2:#ffffff;--bg3:#f5f7fb;--bg4:#eaeff7;
  --border:rgba(60,80,140,0.1);--border2:rgba(60,80,140,0.18);
  --text1:#1a2340;--text2:#5a6a8a;--text3:#9aabcc;--text4:#c5d0e4;
  --accent:#3b7ef4;--accent-s:rgba(59,126,244,0.1);--accent-b:rgba(59,126,244,0.3);
  --green:#18a058;--green-s:rgba(24,160,88,0.1);
  --yellow:#e6820a;--yellow-s:rgba(230,130,10,0.1);
  --red:#e04040;--red-s:rgba(224,64,64,0.1);
  --rx:8px;--rxs:6px;
}
body{background:var(--bg);color:var(--text1);font-family:-apple-system,'PingFang SC',sans-serif;font-size:14px;height:100vh;display:flex;overflow:hidden;}
button,input,textarea,select{font-family:inherit;}
input::placeholder,textarea::placeholder{color:var(--text3);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.nav{width:52px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px;flex-shrink:0;}
.nav-logo{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-bottom:14px;cursor:default;user-select:none;}
.nav-btn{width:38px;height:38px;border-radius:var(--rx);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:17px;transition:all 0.15s;border:none;background:none;}
.nav-btn:hover{background:var(--bg3);color:var(--text2);}
.nav-btn.active{background:var(--accent-s);color:var(--accent);}
.nav-spacer{flex:1;}
.nav-sync{width:38px;height:28px;display:flex;align-items:center;justify-content:center;cursor:default;margin-bottom:2px;}
.nav-sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text4);transition:background 0.4s;}
.nav-sync-dot.ok{background:var(--green);}
.nav-sync-dot.err{background:var(--red);}
.nav-sync-dot.syncing{background:var(--yellow);animation:blink 1s infinite;}

.panel{width:256px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.panel-hd{padding:14px 14px 10px;flex-shrink:0;}
.panel-title{font-size:15px;font-weight:600;margin-bottom:10px;}
.panel-switcher{display:flex;background:var(--bg3);border-radius:7px;padding:3px;gap:2px;}
.psw-btn{flex:1;text-align:center;padding:5px 0;border-radius:5px;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;border:none;background:none;}
.psw-btn.active{background:var(--bg2);color:var(--text1);font-weight:500;}

.panel-body{flex:1;overflow-y:auto;padding-bottom:16px;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-sub{font-size:12px;color:var(--text3);}
.topbar-spacer{flex:1;}
.tb-btn{padding:5px 11px;border-radius:var(--rx);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all 0.15s;}
.tb-btn:hover{border-color:var(--border2);color:var(--text1);}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-btn.primary:hover{background:#6a9ef8;}
.seg{display:flex;background:var(--bg3);border-radius:7px;padding:3px;gap:2px;}
.seg-btn{padding:4px 10px;border-radius:5px;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;border:none;background:none;}
.seg-btn.active{background:var(--bg2);color:var(--text1);}

.content{flex:1;overflow-y:auto;padding:20px;}
.view{display:none;}
.view.on{display:block;}

/* ══════════════════════════════════════════
   PANEL — TODAY
══════════════════════════════════════════ */
.capture-wrap{margin:0 10px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;}
.capture-inp{width:100%;background:transparent;border:none;outline:none;padding:8px 10px;font-size:13px;color:var(--text1);resize:none;min-height:36px;max-height:80px;}
.capture-footer{display:flex;align-items:center;padding:4px 8px;border-top:1px solid var(--border);gap:6px;}
.capture-tag-row{flex:1;display:flex;gap:4px;flex-wrap:wrap;}
.capture-tag-chip{padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;transition:all 0.12s;}
.capture-tag-chip:hover{border-color:var(--border2);}
.capture-tag-chip.sel{border-color:var(--accent-b);color:var(--accent);background:var(--accent-s);}
.capture-submit{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;transition:all 0.12s;white-space:nowrap;}
.capture-submit:hover{color:var(--accent);border-color:var(--accent-b);}
.date-preview{padding:0 10px 4px;font-size:11px;color:var(--accent);}

.inbox-btn{margin:0 10px 8px;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rx);display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text2);font-size:13px;transition:all 0.15s;}
.inbox-btn:hover{border-color:var(--border2);color:var(--text1);}
.inbox-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:600;}

.sec-hd{padding:6px 14px 3px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;justify-content:space-between;}
.sec-count{font-size:10px;color:var(--text4);}

/* ── date nav cards ── */
.date-nav-card{margin:3px 8px;padding:11px 12px;border-radius:var(--rx);cursor:pointer;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent;transition:background 0.12s,border-color 0.12s;}
.date-nav-card:hover{background:var(--bg3);}
.date-nav-card.selected{background:var(--accent-s);border-color:var(--accent-b);}
.date-nav-left{display:flex;flex-direction:column;gap:2px;}
.date-nav-label{font-size:13px;font-weight:500;color:var(--text1);}
.date-nav-sub{font-size:11px;color:var(--text3);}
.date-nav-badge{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:1px 8px;border-radius:10px;white-space:nowrap;}
.date-nav-card.selected .date-nav-label{color:var(--accent);}
.date-nav-card.selected .date-nav-sub{color:var(--accent);opacity:.7;}
.date-nav-card.selected .date-nav-badge{background:var(--accent-s);border-color:var(--accent-b);color:var(--accent);}

/* ── today stat block ── */
.date-stat{margin:10px 8px 0;padding:12px;background:var(--bg3);border-radius:var(--rx);}
.date-stat-label{font-size:11px;color:var(--text3);margin-bottom:7px;}
.date-stat-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.date-stat-bar{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease;}
.date-stat-num{font-size:12px;color:var(--text2);}

.ptask{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;transition:background 0.1s;user-select:none;}
.ptask:hover{background:var(--bg3);}
.ptask.active{background:var(--accent-s);}
.ptask.is-done{opacity:0.4;}
.pchk{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.18s;cursor:pointer;}
.pchk:hover{border-color:var(--green);}
.pchk.done{background:var(--green);border-color:var(--green);}
.pchk.done::after{content:'✓';font-size:8px;color:#fff;}
.ptask-title{flex:1;font-size:13px;line-height:1.35;}
.ptask-title.done{text-decoration:line-through;color:var(--text3);}
.ptask-pri{font-size:10px;padding:1px 5px;border-radius:3px;flex-shrink:0;}
.ptask-pri.urgent{background:var(--red-s);color:var(--red);}
.ptask-pri.important{background:var(--yellow-s);color:var(--yellow);}

/* ══════════════════════════════════════════
   PANEL — SETTLE
══════════════════════════════════════════ */
.settle-search{margin:0 10px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rx);display:flex;align-items:center;gap:6px;padding:0 10px;}
.settle-search input{flex:1;background:transparent;border:none;outline:none;padding:7px 0;font-size:13px;color:var(--text1);}
.settle-search-ico{color:var(--text3);font-size:13px;}
.new-note-btn{margin:0 10px 6px;padding:7px 10px;border:1px dashed var(--border);border-radius:var(--rx);display:flex;align-items:center;gap:6px;color:var(--text3);font-size:13px;cursor:pointer;transition:all 0.15s;}
.new-note-btn:hover{border-color:var(--accent);color:var(--accent);}

.cat-group{margin-bottom:2px;}
.cat-hd{padding:5px 14px;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;transition:color 0.1s;}
.cat-hd:hover{color:var(--text1);}
.cat-arrow{font-size:8px;transition:transform 0.15s;}
.cat-arrow.open{transform:rotate(90deg);}

/* ══ MANAGER MODAL ══ */
.mgr-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.mgr-row:last-child{border-bottom:none;}
.mgr-color{width:28px;height:28px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px;background:var(--bg3);}
.mgr-icon{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:14px;cursor:pointer;outline:none;color:var(--text1);}
.mgr-name{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:13px;color:var(--text1);outline:none;}
.mgr-name:focus{border-color:var(--accent-b);}
.mgr-del{width:24px;height:24px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:4px;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.12s;flex-shrink:0;}
.mgr-del:hover{background:var(--red-s);color:var(--red);}
.mgr-gear{padding:2px 5px;border:none;background:transparent;color:var(--text4);cursor:pointer;font-size:11px;border-radius:3px;transition:color 0.12s;flex-shrink:0;}
.mgr-gear:hover{color:var(--text2);}
.mgr-footer-left{flex:1;display:flex;justify-content:flex-start;}
.settle-actions{display:flex;align-items:center;gap:6px;margin:0 10px 6px;}

.note-row{padding:5px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.1s;}
.note-row:hover{background:var(--bg3);}
.note-row.active{background:var(--accent-s);}
.note-dot{width:4px;height:4px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.note-row-title{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-row-date{font-size:10px;color:var(--text3);flex-shrink:0;}

/* ══════════════════════════════════════════
   MAIN — TASK LIST VIEW
══════════════════════════════════════════ */
.tasks-group{margin-bottom:20px;}
.tg-hd{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.tg-hd::after{content:'';flex:1;height:1px;background:var(--border);}

.task-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:10px 14px;margin-bottom:5px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color 0.15s;}
.task-card:hover{border-color:var(--border2);}
.task-card.done-card{opacity:0.38;}
.task-card .chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.18s;cursor:pointer;}
.task-card .chk:hover{border-color:var(--green);}
.task-card .chk.done{background:var(--green);border-color:var(--green);}
.task-card .chk.done::after{content:'✓';font-size:8px;color:#fff;}
.tc-body{flex:1;min-width:0;}
.tc-title{font-size:14px;margin-bottom:4px;line-height:1.4;}
.tc-title.done{text-decoration:line-through;color:var(--text3);}
.tc-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.badge{padding:2px 6px;border-radius:4px;font-size:11px;}
.badge.blue{background:var(--accent-s);color:var(--accent);}
.badge.green{background:var(--green-s);color:var(--green);}
.badge.red{background:var(--red-s);color:var(--red);}
.badge.yellow{background:var(--yellow-s);color:var(--yellow);}
.badge.gray{background:var(--bg3);color:var(--text2);}
.tc-note{font-size:12px;color:var(--text3);margin-bottom:4px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc-links{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.tc-link{font-size:11px;color:var(--accent);text-decoration:none;background:var(--accent-s);border-radius:4px;padding:1px 6px;}
.tc-link:hover{text-decoration:underline;}
.tc-acts{display:flex;gap:2px;opacity:0.25;transition:opacity 0.15s;flex-shrink:0;align-items:flex-start;}
.task-card:hover .tc-acts{opacity:1;}
.tc-act-btn{width:26px;height:26px;border-radius:var(--rxs);border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.12s;}
.tc-act-btn:hover{background:var(--bg3);color:var(--text1);}
.tc-act-btn.del:hover{color:var(--red);}

/* ══════════════════════════════════════════
   KANBAN VIEW
══════════════════════════════════════════ */
.kanban-wrap{display:flex;gap:12px;align-items:flex-start;padding-bottom:20px;}
.k-col{flex:1;min-width:0;}
.k-col-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:0 2px;}
.k-col-dot{width:7px;height:7px;border-radius:50%;}
.k-col-label{font-size:12px;font-weight:600;color:var(--text2);}
.k-col-cnt{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:10px;}
.k-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:10px 12px;margin-bottom:5px;cursor:pointer;transition:border-color 0.15s;}
.k-card:hover{border-color:var(--border2);}
.k-card-title{font-size:13px;margin-bottom:6px;line-height:1.4;}
.k-card-meta{display:flex;gap:4px;flex-wrap:wrap;}

/* ══════════════════════════════════════════
   MATRIX VIEW
══════════════════════════════════════════ */
.matrix-wrap{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;}
.mx-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:14px;overflow-y:auto;}
.mx-hd{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;}
.mx-item{padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.1s;}
.mx-item:last-child{border-bottom:none;}
.mx-item:hover{background:var(--bg3);padding-left:4px;border-radius:4px;}
.mx-item-title{font-size:13px;flex:1;}
.mx-item-meta{display:flex;gap:4px;}

/* ══════════════════════════════════════════
   NOTE EDITOR VIEW
══════════════════════════════════════════ */
.note-editor-wrap{display:flex;flex-direction:column;height:100%;}
.ne-titlebar{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-shrink:0;}
.ne-title-inp{flex:1;font-size:22px;font-weight:700;background:transparent;border:none;outline:none;color:var(--text1);}
.ne-meta{font-size:11px;color:var(--text3);display:flex;gap:12px;margin-bottom:14px;flex-shrink:0;}
.ne-body{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--text2);font-size:14px;line-height:1.85;}

/* ══════════════════════════════════════════
   PROJECT LOG VIEW
══════════════════════════════════════════ */
.proj-layout{display:flex;gap:0;height:100%;}
.proj-sidebar{width:200px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.proj-sidebar-hd{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;}
.proj-sidebar-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.proj-sidebar-add{width:22px;height:22px;border-radius:5px;border:1px dashed var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.proj-sidebar-add:hover{border-color:var(--accent);color:var(--accent);}
.proj-item{padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.1s;font-size:13px;color:var(--text2);}
.proj-item:hover{background:var(--bg3);}
.proj-item.active{background:var(--accent-s);color:var(--text1);}
.proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

.proj-main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 20px;}
.proj-main-hd{padding:14px 0 10px;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.proj-main-title{font-size:18px;font-weight:700;flex:1;}
.proj-logs{flex:1;overflow-y:auto;}
.log-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:12px 14px;margin-bottom:8px;}
.log-item-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.log-date{font-size:11px;color:var(--text3);}
.log-body{font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
.log-acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity 0.15s;}
.log-item:hover .log-acts{opacity:1;}
.log-act-btn{width:24px;height:24px;border-radius:5px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.12s;}
.log-act-btn:hover{background:var(--bg3);color:var(--text1);}
.log-act-btn.del:hover{color:var(--red);}
.add-log-wrap{flex-shrink:0;border-top:1px solid var(--border);padding:12px 0;}
.add-log-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rx);padding:8px 12px;font-size:13px;color:var(--text1);outline:none;resize:none;min-height:36px;max-height:100px;transition:border-color 0.15s;}
.add-log-inp:focus{border-color:var(--border2);}
.add-log-footer{display:flex;justify-content:flex-end;margin-top:6px;}

/* ══════════════════════════════════════════
   SETTINGS VIEW
══════════════════════════════════════════ */
.settings-wrap{max-width:480px;}
.settings-section{margin-bottom:28px;}
.settings-section-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.setting-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.setting-label{font-size:13px;color:var(--text2);width:80px;flex-shrink:0;}
.setting-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rxs);padding:7px 10px;font-size:13px;color:var(--text1);outline:none;transition:border-color 0.15s;}
.setting-inp:focus{border-color:var(--border2);}
.setting-inp[type=password]{letter-spacing:2px;}
.sync-status-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.syncing{background:var(--yellow);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ══════════════════════════════════════════
   SYNC STRIP
══════════════════════════════════════════ */
.sync-strip{position:fixed;top:5px;left:0;right:0;height:2px;z-index:200;display:none;border-radius:1px;}
.sync-strip.active{display:block;}

var S={

  // UI state (not persisted)

  _kActiveTag:null,
  _letterIdx:0,
};
var TAGS=[{name:'工作',color:'#4f8ef7'},{name:'学习',color:'#34c97a'},{name:'生活',color:'#ff9500'},{name:'其他',color:'#8e8e93'}];
var REVIEW_MOODS=['😄 充沛','😊 不错','😐 平平','😴 疲惫','😤 焦虑'];
var REVIEW_QS=[
  '今天做了什么重要判断或决定？当时的依据是什么？',
  '有什么地方结果和预期不一样？',
  '如果今天重来，最想改的一个细节是什么？'
];

var _aiChatMsgs=[];
var _aiChatDragging=false,_aiDragOX=0,_aiDragOY=0;

var _syncTimer=null;
var _ghSha=null;

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function eid(id){return document.getElementById(id);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function pad(n){return n<10?'0'+n:String(n);}
function todayStr(){var n=new Date();return pad(n.getMonth()+1)+'/'+pad(n.getDate());}
function tomorrowStr(){var d=new Date();d.setDate(d.getDate()+1);return pad(d.getMonth()+1)+'/'+pad(d.getDate());}
function fmtDate(ts){if(!ts)return'';var d=new Date(ts);return pad(d.getMonth()+1)+'/'+pad(d.getDate());}
function getTagColor(name){var t=TAGS.find(function(x){return x.name===name;});return t?t.color:'#8e8e93';}
function toast(msg){var t=eid('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},1800);}

function parseNaturalDate(text){
  var now=new Date();
  var map={'今天':0,'今日':0,'明天':1,'明日':1,'后天':2};
  var wm={'下周一':1,'下周二':2,'下周三':3,'下周四':4,'下周五':5,'下周六':6,'下周日':0,'下周天':0};
  for(var k in map){if(text.indexOf(k)!==-1){var d=new Date(now);d.setDate(d.getDate()+map[k]);return pad(d.getMonth()+1)+'/'+pad(d.getDate());}}
  for(var k in wm){if(text.indexOf(k)!==-1){var t=wm[k],dy=now.getDay(),df=(t-dy+7)%7;if(df===0)df=7;var d=new Date(now);d.setDate(d.getDate()+df);return pad(d.getMonth()+1)+'/'+pad(d.getDate());}}
  var m=text.match(/(\d{1,2})[\/月](\d{1,2})[日号]?/);
  if(m)return pad(parseInt(m[1]))+'/'+pad(parseInt(m[2]));
  return null;
}
function stripDateKW(text){return text.replace(/(今天|今日|明天|明日|后天|下周[一二三四五六日天]|\d{1,2}[\/月]\d{1,2}[日号]?)/g,'').trim();}

/* ══════════════════════════════════════════
   STORAGE & SYNC
══════════════════════════════════════════ */
function getCfg(){try{return JSON.parse(localStorage.getItem('ws_cfg')||'{}');}catch(e){return {};}}
function saveCfg(c){localStorage.setItem('ws_cfg',JSON.stringify(c));}
function isConfigured(){var c=getCfg();return !!(c.owner&&c.repo&&c.token);}

function saveLocal(){
  try{
    localStorage.setItem('ws_v3new',JSON.stringify({
      tasks:S.tasks,notes:S.notes,inbox:S.inbox,
      projects:S.projects,knowledge:S.knowledge,books:S.books,deletedIds:S.deletedIds,
      reviews:S.reviews,kcards:S.kcards,weeklyLetters:S.weeklyLetters
    }));
  }catch(e){}
}

function loadLocal(){
  // 先尝试读新格式
  try{
    var d=JSON.parse(localStorage.getItem('ws_v3new')||'{}');
    if(d.tasks){
      S.tasks=d.tasks||[];S.notes=d.notes||[];S.inbox=d.inbox||[];
      S.projects=d.projects||[];S.knowledge=d.knowledge||[];S.books=d.books||[];S.deletedIds=d.deletedIds||[];
      S.reviews=d.reviews||[];S.kcards=d.kcards||[];S.weeklyLetters=d.weeklyLetters||[];
      return;
    }
  }catch(e){}
  // 迁移 v4 旧数据
  try{
    var old=JSON.parse(localStorage.getItem('ws_v4')||'{}');
    if(old.tasks||old.notes){
      S.tasks=old.tasks||[];
      S.inbox=old.inbox||[];
      S.deletedIds=old.deletedIds||[];
      S.projects=old.projects||[];
      S.knowledge=old.knowledge||[];
      S.books=old.books||[];
      // 迁移笔记：v4 的 notes 包含 notes/review/books，映射到 cat
      S.notes=(old.notes||[]).map(function(n){
        var cat=n.cat||'notes';
        // v4 review 分类 -> review
        if(n.isReview||cat==='review')cat='review';
        return Object.assign({},n,{cat:cat});
      });
      saveLocal();
      toast('已从 v2.8 迁移数据 ✓');
      return;
    }
  }catch(e){}
}

function save(){
  saveLocal();
  if(isConfigured()){clearTimeout(_syncTimer);_syncTimer=setTimeout(ghPush,1500);}
}

function ghHeaders(){var c=getCfg();return{'Authorization':'token '+c.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};}
function ghUrl(){var c=getCfg();return'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/workspace-data-v3.json';}

function syncBarStart(){
  var strip=eid('sync-strip'),bar=eid('sync-bar'),lbl=eid('sync-label');
  if(strip){strip.style.display='block';strip.className='sync-strip active';}
  if(bar){bar.style.background='var(--accent)';bar.style.width='0%';requestAnimationFrame(function(){bar.style.width='80%';});}
  if(lbl){lbl.style.opacity='1';lbl.textContent='同步中…';}
}
function syncBarDone(ok){
  var strip=eid('sync-strip'),bar=eid('sync-bar'),lbl=eid('sync-label');
  if(bar){bar.style.width='100%';bar.style.background=ok?'var(--green)':'var(--red)';}
  if(lbl)lbl.textContent=ok?'✓ 已保存':'✕ 同步失败';
  setTimeout(function(){
    if(strip){strip.className='sync-strip done fade';setTimeout(function(){strip.style.display='none';bar.style.width='0%';},300);}
    if(lbl)lbl.style.opacity='0';
  },1400);
  // update settings dot
  var dot=eid('sync-dot'),st=eid('sync-st-text');
  if(dot)dot.className='sync-dot'+(ok?' ok':' err');
  if(st)st.textContent=ok?'已同步':'同步失败';
  var navDot=eid('nav-sync-dot');
  if(navDot){
    navDot.className='nav-sync-dot'+(ok?' ok':' err');
    var now=new Date();navDot.title=(ok?'已同步':'同步失败')+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  }
}

async function ghPull(){
  if(!isConfigured())return null;
  try{
    var r=await fetch(ghUrl(),{headers:ghHeaders()});
    if(r.status===404){_ghSha=null;return'notfound';}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var json=await r.json();_ghSha=json.sha;
    var remote=JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g,'')))));
    mergeRemote(remote);return true;
  }catch(e){console.warn('ghPull',e);return false;}
}

async function ghPush(){
  if(!isConfigured())return;
  syncBarStart();
  try{
    var payload={tasks:S.tasks,notes:S.notes,inbox:S.inbox,projects:S.projects,knowledge:S.knowledge,books:S.books,deletedIds:S.deletedIds,reviews:S.reviews,kcards:S.kcards,weeklyLetters:S.weeklyLetters};
    var content=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2))));
    var body={message:'sync '+new Date().toISOString(),content:content};
    if(_ghSha)body.sha=_ghSha;
    var r=await fetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
    if(!r.ok){var err=await r.json();throw new Error(err.message||'HTTP '+r.status);}
    var json=await r.json();_ghSha=json.content.sha;
    syncBarDone(true);
  }catch(e){syncBarDone(false);}
}

function mergeRemote(remote){
  var allDel=S.deletedIds.slice();
  (remote.deletedIds||[]).forEach(function(id){if(allDel.indexOf(id)===-1)allDel.push(id);});
  S.deletedIds=allDel;
  function merge(local,rem){
    var map={};
    local.forEach(function(x){map[x.id]=x;});
    (rem||[]).forEach(function(rx){
      if(allDel.indexOf(rx.id)!==-1)return;
      if(!map[rx.id]||(rx.created||0)>(map[rx.id].created||0))map[rx.id]=rx;
    });
    return Object.values(map).filter(function(x){return allDel.indexOf(x.id)===-1;});
  }
  S.tasks=merge(S.tasks,remote.tasks);
  S.notes=merge(S.notes,remote.notes);
  S.inbox=merge(S.inbox,remote.inbox);
  if(remote.projects&&remote.projects.length)S.projects=remote.projects;
  if(remote.books&&remote.books.length)S.books=remote.books;
  if(remote.knowledge&&remote.knowledge.length)S.knowledge=remote.knowledge;
  if(remote.reviews&&remote.reviews.length)S.reviews=merge(S.reviews,remote.reviews);
  if(remote.kcards)S.kcards=merge(S.kcards,remote.kcards||[]);
  if(remote.weeklyLetters&&remote.weeklyLetters.length)S.weeklyLetters=remote.weeklyLetters;
  saveLocal();
}

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
function renderTodayPanel(el){
  var today=todayStr();
  var tomorrow=tomorrowStr();
  // 默认选中今天
  if(!S.selectedDate)S.selectedDate=today;

  var sections=[
    {key:today,label:'今天'},
    {key:tomorrow,label:'明天'},
    {key:'later',label:'稍后'},
  ];
  var inboxCnt=S.inbox.length;
  var html='<div class="capture-wrap" style="margin-top:4px">'+
    '<textarea class="capture-inp" id="capture-inp" rows="1" placeholder="快速记录任务... (输入日期自动识别)" '+
    'oninput="onCaptureInput(this)" onkeydown="captureKey(event)"></textarea>'+
    '<div class="date-preview" id="date-preview"></div>'+
    '<div class="capture-footer">'+
      '<div class="capture-tag-row" id="capture-tags"></div>'+
      '<button class="capture-submit" onclick="submitCapture()">↵ 回车</button>'+
    '</div>'+
  '</div>'+
  '<div class="inbox-btn" onclick="switchToInbox()">'+
    '📥 收集箱'+
    (inboxCnt?'<div class="inbox-badge">'+inboxCnt+'</div>':'')+
  '</div>';

  var selItems;
  sections.forEach(function(sec){
    var items;
    if(sec.key==='later'){
      items=S.tasks.filter(function(t){return !t.isTemplate&&t.date!==today&&t.date!==tomorrow&&(!t.date||t.date>tomorrow);});
    } else {
      items=S.tasks.filter(function(t){return !t.isTemplate&&t.date===sec.key;});
    }
    if(sec.key===S.selectedDate)selItems=items;
    var undone=items.filter(function(t){return !t.done&&t.status!=='cancel';}).length;
    var isSel=S.selectedDate===sec.key;
    var sub=sec.key==='later'?'稍后日期':sec.key;
    html+='<div class="date-nav-card'+(isSel?' selected':'')+'" onclick="selectDate(\''+sec.key+'\')">'+
      '<div class="date-nav-left">'+
        '<div class="date-nav-label">'+sec.label+'</div>'+
        '<div class="date-nav-sub">'+sub+'</div>'+
      '</div>'+
      '<div class="date-nav-badge">'+undone+' / '+items.length+'</div>'+
    '</div>';
  });
  // 进度块
  if(selItems){
    var total=selItems.length;
    var done=selItems.filter(function(t){return t.done||t.status==='done';}).length;
    var pct=total?Math.round(done/total*100):0;
    var selLabel=S.selectedDate===today?'今天':S.selectedDate===tomorrow?'明天':'稍后';
    html+='<div class="date-stat">'+
      '<div class="date-stat-label">'+selLabel+'完成进度</div>'+
      '<div class="date-stat-bar-wrap"><div class="date-stat-bar" style="width:'+pct+'%"></div></div>'+
      '<div class="date-stat-num">完成 '+done+' / '+total+' 个任务'+(!total?' — 还没有任务':pct===100?' 🎉 全部完成':'')+'</div>'+
    '</div>';
  }
  // 复盘入口
  var todayReview=S.reviews.find(function(r){return r.date===today;});
  html+='<div class="review-nav-card'+(todayReview?' done':'')+'" onclick="openReviewView(\''+today+'\')" style="margin-top:6px">'+
    '<div style="display:flex;align-items:center;gap:7px;">'+
      '<span style="font-size:15px">📔</span>'+
      '<div>'+
        '<div style="font-size:13px;font-weight:500;color:var(--text1)">今日复盘</div>'+

/* ══════════════════════════════════════════
   TASK OPERATIONS
══════════════════════════════════════════ */
function sortTasks(arr){
  return arr.slice().sort(function(a,b){
    var aDone=!!(a.done||a.status==='done'||a.status==='cancel');
    var bDone=!!(b.done||b.status==='done'||b.status==='cancel');
    if(aDone!==bDone)return aDone?1:-1;
    var po={urgent:0,important:1,normal:2};
    var ap=po[a.priority]||2,bp=po[b.priority]||2;
    if(ap!==bp)return ap-bp;
    return (b.sortOrder||b.created||0)-(a.sortOrder||a.created||0);
  });
}

function toggleTask(id,e){
  if(e)e.stopPropagation();
  var t=S.tasks.find(function(x){return x.id===id;});if(!t)return;
  t.done=!t.done;t.status=t.done?'done':'todo';
  save();renderPanel();if(S.panelMode==='today')renderTaskMain();
  toast(t.done?'✓ 完成':'↩ 撤销');
}

function deleteTask(id,e){
  if(e)e.stopPropagation();
  if(!confirm('删除这个任务？'))return;
  S.tasks=S.tasks.filter(function(x){return x.id!==id;});
  S.deletedIds.push(id);save();renderPanel();renderTaskMain();toast('已删除');
}

function setTaskView(type,btn){
  S.taskView=type;
  document.querySelectorAll('.seg-btn').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');

function renderTaskMain(){
  if(S.navMode!=='home'||S.panelMode!=='today')return;
  if(!S.selectedDate)S.selectedDate=todayStr();
  updateTopbarForDate(S.selectedDate);
  if(S.taskView==='list')renderListView();
  else if(S.taskView==='kanban')renderKanbanView();
  else if(S.taskView==='matrix')renderMatrixView();

function updateTopbarForDate(key){
  var today=todayStr();
  var tomorrow=tomorrowStr();
  var label=key===today?'今天':key===tomorrow?'明天':'稍后';
  var sub=key===today?today:key===tomorrow?tomorrow:'';
  eid('tb-title').textContent=label+'的任务';
  eid('tb-sub').textContent=sub;
}

function renderListView(){
  showView('view-list');
  var el=eid('view-list');
  var today=todayStr();
  var tomorrow=tomorrowStr();
  var selDate=S.selectedDate||today;

  // 筛选选中日期的任务
  var tasks;
  if(selDate==='later'){
    tasks=S.tasks.filter(function(t){return !t.isTemplate&&t.date!==today&&t.date!==tomorrow&&(!t.date||t.date>tomorrow);});
  } else {
    tasks=S.tasks.filter(function(t){return !t.isTemplate&&t.date===selDate;});
  }

  if(!tasks.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">✨</div><div>暂无任务</div><div style="font-size:12px;color:var(--text3);margin-top:4px">点击右上角「+ 新任务」添加</div></div>';
    return;
  }

  var sorted=sortTasks(tasks);
  var undone=sorted.filter(function(t){return !t.done&&t.status!=='done'&&t.status!=='cancel';});
  var done=sorted.filter(function(t){return t.done||t.status==='done'||t.status==='cancel';});

  var html='';
  if(undone.length){
    html+='<div class="tasks-group"><div class="tg-hd">待完成</div>'+undone.map(taskCardHtml).join('')+'</div>';
  }
  if(done.length){
    html+='<div class="tasks-group"><div class="tg-hd">已完成</div>'+done.map(taskCardHtml).join('')+'</div>';
  }
  el.innerHTML=html;
}

function taskCardHtml(t){
  var linksHtml='';
  if(t.links&&t.links.length){
    linksHtml='<div class="tc-links">'+t.links.map(function(l){
      return'<a class="tc-link" href="'+esc(l.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 '+esc(l.text||l.url)+'</a>';
    }).join('')+'</div>';
  }
  return'<div class="task-card'+(t.done?' done-card':'')+'" id="tc-'+t.id+'">'+
    '<div class="chk'+(t.done?' done':'')+'" onclick="toggleTask(\''+t.id+'\',event)"></div>'+
    '<div class="tc-body" onclick="openEditTaskModal(\''+t.id+'\')">'+
      '<div class="tc-title'+(t.done?' done':'')+'">'+esc(t.title)+'</div>'+
      (t.note?'<div class="tc-note">'+esc(t.note)+'</div>':'')+
      linksHtml+
      '<div class="tc-meta">'+
        (t.priority==='urgent'?'<span class="badge red">紧急</span>':t.priority==='important'?'<span class="badge yellow">重要</span>':'')+
        (t.tag?'<span class="badge blue">'+esc(t.tag)+'</span>':'')+
        (t.status==='doing'?'<span class="badge blue">进行中</span>':'')+
        (t.status==='cancel'?'<span class="badge gray">已取消</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="tc-acts">'+
      '<button class="tc-act-btn del" onclick="deleteTask(\''+t.id+'\',event)" title="删除">✕</button>'+
    '</div>'+
  '</div>';
}

function renderKanbanView(){
  showView('view-kanban');
  var el=eid('view-kanban');
  var tasks=S.tasks.filter(function(t){return !t.isTemplate;});
  var cols=[
    {key:'todo',label:'未开始',color:'#8e8e93'},
    {key:'doing',label:'进行中',color:'var(--accent)'},
    {key:'done',label:'已完成',color:'var(--green)'},
    {key:'cancel',label:'已取消',color:'var(--yellow)'},
  ];
  el.innerHTML='<div class="kanban-wrap">'+cols.map(function(col){
    var items=tasks.filter(function(t){
      var s=t.status||'todo';
      if(col.key==='done')return s==='done'||t.done;
      return s===col.key&&!t.done;
    });
    items=sortTasks(items);
    return'<div class="k-col">'+
      '<div class="k-col-hd"><div class="k-col-dot" style="background:'+col.color+'"></div><span class="k-col-label">'+col.label+'</span><span class="k-col-cnt">'+items.length+'</span></div>'+
      (items.length?items.map(function(t){
        return'<div class="k-card" onclick="openEditTaskModal(\''+t.id+'\')">'+
          '<div class="k-card-title">'+esc(t.title)+'</div>'+
          '<div class="k-card-meta">'+
            (t.priority==='urgent'?'<span class="badge red">紧急</span>':t.priority==='important'?'<span class="badge yellow">重要</span>':'')+
            (t.tag?'<span class="badge blue">'+esc(t.tag)+'</span>':'')+
            (t.date?'<span class="badge gray">'+esc(t.date)+'</span>':'')+
          '</div>'+
        '</div>';
      }).join(''):'<div style="padding:20px 0;text-align:center;color:var(--text4);font-size:12px">空</div>')+
    '</div>';
  }).join('')+'</div>';
}

function renderMatrixView(){
  showView('view-matrix');
  var el=eid('view-matrix');
  var tasks=S.tasks.filter(function(t){return !t.isTemplate&&!t.done&&t.status!=='done'&&t.status!=='cancel';});
  el.style.display='grid';
  el.style.gridTemplateColumns='1fr 1fr';
  el.style.gridTemplateRows='1fr 1fr';
  el.style.gap='10px';
  var cells=[
    {label:'🔴 重要且紧急',test:function(t){return t.priority==='urgent';}},
    {label:'🟡 重要不紧急',test:function(t){return t.priority==='important';}},
    {label:'⚪ 普通',test:function(t){return !t.priority||t.priority==='normal';}},
    {label:'· 待分类',test:function(t){return false;}},
  ];
  var used=[];
  el.innerHTML=cells.map(function(c){
    var items=tasks.filter(function(t){return c.test(t)&&used.indexOf(t.id)===-1;});
    items.forEach(function(t){used.push(t.id);});
    return'<div class="mx-cell">'+
      '<div class="mx-hd">'+c.label+'</div>'+
      (items.length?items.map(function(t){
        return'<div class="mx-item" onclick="openEditTaskModal(\''+t.id+'\')">'+
          '<div class="mx-item-title">'+esc(t.title)+'</div>'+
          '<div class="mx-item-meta">'+
            (t.tag?'<span class="badge blue" style="font-size:10px">'+esc(t.tag)+'</span>':'')+
          '</div>'+
        '</div>';
      }).join(''):'<div style="padding:12px 0;text-align:center;color:var(--text4);font-size:12px">空</div>')+
    '</div>';
  }).join('');
}

function openAddTaskModal(){
  S._modalAction='addTask';S._editingTaskId=null;

function openEditTaskModal(id){

  S._modalAction='editTask';S._editingTaskId=id;
  S._editTaskTag=t.tag||null;S._editTaskStatus=t.status||'todo';S._editTaskPri=t.priority||'normal';

function deleteTaskFromModal(){

}

function buildTaskModalHtml(t,date){
  var title=t?t.title:'';
  var note=t?t.note||'':'';
  var status=t?t.status||'todo':'todo';
  var pri=t?t.priority||'normal':'normal';
  var dateVal=date||todayStr();
  S._editTaskStatus=status;S._editTaskPri=pri;

  function pillCls(type){
    if(type==='status'){return'tpill'+(status==='doing'?' st-doing':status==='done'?' st-done':status==='cancel'?' st-cancel':'');}
    if(type==='pri'){return'tpill'+(pri==='important'?' pri-important':pri==='urgent'?' pri-urgent':'');}
    return'tpill';
  }
  return'<input class="m-inp big" id="tm-title" value="'+esc(title)+'" placeholder="任务名称" autofocus />'+
    '<div class="task-meta-pills">'+
      '<button class="tpill" id="tp-date" onclick="openTpill(\'date\',this)">📅 '+esc(dateVal)+'</button>'+
      '<button class="'+pillCls('status')+'" id="tp-status" onclick="openTpill(\'status\',this)">'+STATUS_LABELS[status]+'</button>'+
      '<button class="'+pillCls('pri')+'" id="tp-pri" onclick="openTpill(\'pri\',this)">'+PRI_LABELS[pri]+'</button>'+
      '<button class="tpill" id="tp-tag" onclick="openTpill(\'tag\',this)">'+(S._editTaskTag?'🏷 '+esc(S._editTaskTag):'🏷 无标签')+'</button>'+
    '</div>'+
    '<div class="modal-rule"></div>'+
    '<textarea class="m-ta" id="tm-note" rows="4" placeholder="备注…">'+esc(note)+'</textarea>'+
    '<input type="hidden" id="tm-date" value="'+esc(dateVal)+'" />';
}

function openTpill(type,btn){
  closeTpill();
  var rect=btn.getBoundingClientRect();
  var pick=document.createElement('div');
  pick.className='tpill-picker';_tpillPicker=pick;
  document.body.appendChild(pick);

  if(type==='date'){
    var cur=eid('tm-date')?eid('tm-date').value:'';
    pick.style.cssText='padding:8px 10px;min-width:170px;';
    pick.innerHTML='<div style="font-size:11px;color:var(--text3);margin-bottom:6px">日期 (MM/DD)</div>'+
      '<input class="m-inp" style="height:30px;margin-bottom:6px" id="tp-date-inp" value="'+esc(cur)+'" placeholder="MM/DD" />'+
      '<div style="display:flex;gap:6px">'+
        '<button class="tpick-opt" style="flex:1" onclick="setTpillDate(\''+todayStr()+'\')">今天</button>'+
        '<button class="tpick-opt" style="flex:1" onclick="setTpillDate(\''+tomorrowStr()+'\')">明天</button>'+
      '</div>';
    pick.querySelector('#tp-date-inp').addEventListener('change',function(){setTpillDate(this.value);});
  } else if(type==='status'){
    ['todo','doing','done','cancel'].forEach(function(s){
      var o=document.createElement('button');o.className='tpick-opt'+(S._editTaskStatus===s?' cur':'');
      o.textContent=STATUS_LABELS[s];
      o.onclick=function(){S._editTaskStatus=s;updatePillBtn('status');closeTpill();};
      pick.appendChild(o);
    });
  } else if(type==='pri'){
    ['normal','important','urgent'].forEach(function(p){
      var o=document.createElement('button');o.className='tpick-opt'+(S._editTaskPri===p?' cur':'');
      o.textContent=PRI_LABELS[p];
      o.onclick=function(){S._editTaskPri=p;updatePillBtn('pri');closeTpill();};
      pick.appendChild(o);
    });
  } else if(type==='tag'){
    var no=document.createElement('button');no.className='tpick-opt'+(S._editTaskTag===null?' cur':'');
    no.textContent='无标签';no.onclick=function(){S._editTaskTag=null;updatePillBtn('tag');closeTpill();};
    pick.appendChild(no);
    TAGS.forEach(function(tg){
      var o=document.createElement('button');o.className='tpick-opt'+(S._editTaskTag===tg.name?' cur':'');
      o.innerHTML='<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+tg.color+';margin-right:6px;vertical-align:middle"></span>'+esc(tg.name);
      o.onclick=function(){S._editTaskTag=tg.name;updatePillBtn('tag');closeTpill();};
      pick.appendChild(o);
    });
  }

  pick.style.top=(rect.bottom+4)+'px';
  pick.style.left=rect.left+'px';
  setTimeout(function(){
    var rw=pick.offsetWidth,vw=window.innerWidth;
    if(rect.left+rw>vw-8)pick.style.left=(vw-rw-8)+'px';
    document.addEventListener('click',closeTpillOutside,true);
  },0);
}
function closeTpillOutside(e){if(_tpillPicker&&!_tpillPicker.contains(e.target))closeTpill();}
function closeTpill(){if(_tpillPicker){_tpillPicker.remove();_tpillPicker=null;}document.removeEventListener('click',closeTpillOutside,true);}
function setTpillDate(v){var h=eid('tm-date');if(h)h.value=v;updatePillBtn('date');closeTpill();}
function updatePillBtn(type){
  if(type==='date'){var b=eid('tp-date'),v=eid('tm-date');if(b&&v)b.textContent='📅 '+v.value;}
  if(type==='status'){var b=eid('tp-status');if(b){var s=S._editTaskStatus;b.className='tpill'+(s==='doing'?' st-doing':s==='done'?' st-done':s==='cancel'?' st-cancel':'');b.textContent=STATUS_LABELS[s];}}
  if(type==='pri'){var b=eid('tp-pri');if(b){var p=S._editTaskPri;b.className='tpill'+(p==='important'?' pri-important':p==='urgent'?' pri-urgent':'');b.textContent=PRI_LABELS[p];}}
  if(type==='tag'){var b=eid('tp-tag');if(b)b.textContent=S._editTaskTag?'🏷 '+S._editTaskTag:'🏷 无标签';}
}

function confirmTaskModal(){
  var title=(eid('tm-title').value||'').trim();
  if(!title){toast('任务名称不能为空');return;}
  var date=(eid('tm-date').value||'').trim()||todayStr();
  var note=(eid('tm-note').value||'').trim();
  if(S._modalAction==='addTask'){
    S.tasks.unshift({id:uid(),title:title,tag:S._editTaskTag,date:date,done:false,
      status:S._editTaskStatus||'todo',priority:S._editTaskPri||'normal',note:note,
      created:Date.now(),sortOrder:Date.now()});
  } else {
    var t=S.tasks.find(function(x){return x.id===S._editingTaskId;});if(!t)return;
    t.title=title;t.date=date;t.tag=S._editTaskTag;t.note=note;
    t.status=S._editTaskStatus;t.done=S._editTaskStatus==='done';t.priority=S._editTaskPri;
  }
  save();closeTaskModal();renderPanel();renderTaskMain();
  toast(S._modalAction==='addTask'?'任务已添加 ✓':'已更新 ✓');
}
function closeTaskModal(e){
  if(e&&e.target!==eid('task-modal-ov'))return;
  closeTpill();eid('task-modal-ov').classList.remove('on');
  S._modalAction=null;S._editingTaskId=null;
  eid('task-modal-footer').innerHTML=
    '<button class="modal-btn" onclick="closeTaskModal()">取消</button>'+
    '<button class="modal-btn primary" onclick="confirmTaskModal()">保存</button>';
}

function openInbox(){
  eid('drawer-ov').classList.add('on');
  eid('drawer').classList.add('on');
  renderInboxDrawer();
  setTimeout(function(){var e=eid('inbox-inp');if(e)e.focus();},200);
}
function closeInbox(){eid('drawer-ov').classList.remove('on');eid('drawer').classList.remove('on');}
function inboxKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitInbox();}}
function submitInbox(){
  var inp=eid('inbox-inp');var raw=inp.value.trim();if(!raw)return;
  S.inbox.unshift({id:uid(),title:raw,created:Date.now()});
  save();inp.value='';renderInboxDrawer();renderPanel();toast('已存入收集箱 ✓');
}
function renderInboxDrawer(){
  var el=eid('drawer-body');if(!el)return;
  if(!S.inbox.length){el.innerHTML='<div class="empty-state" style="min-height:150px">收集箱为空</div>';return;}
  el.innerHTML=S.inbox.map(function(item){
    var ds='';
    if(item.created){var d=new Date(item.created);if(!isNaN(d.getTime()))ds=pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
    return'<div class="inbox-item">'+
      '<div class="inbox-item-title">'+esc(item.title)+'</div>'+
      '<div class="inbox-item-meta">'+
        '<span class="inbox-item-date">'+ds+'</span>'+
        '<button class="inbox-act-btn" onclick="promoteInbox(\''+item.id+'\')">→ 加入任务</button>'+
        '<button class="inbox-act-btn del" onclick="deleteInbox(\''+item.id+'\')">删除</button>'+
      '</div>'+
    '</div>';
  }).join('');
}
function promoteInbox(id){
  var item=S.inbox.find(function(x){return x.id===id;});if(!item)return;
  S.tasks.unshift({id:uid(),title:item.title,date:todayStr(),done:false,status:'todo',priority:'normal',created:Date.now(),sortOrder:Date.now()});
  S.inbox=S.inbox.filter(function(x){return x.id!==id;});
  S.deletedIds.push(id);save();renderInboxDrawer();renderPanel();renderTaskMain();
  toast('已加入今日任务 ✓');
}
function deleteInbox(id){
  S.inbox=S.inbox.filter(function(x){return x.id!==id;});
  S.deletedIds.push(id);save();renderInboxDrawer();renderPanel();toast('已删除');
}

function renderSettlePanel(el){
  var html='<div class="settle-search">'+
    '<span class="settle-search-ico">⌕</span>'+
    '<input placeholder="搜索..." oninput="filterSettle(this.value)" id="settle-search-inp">'+
  '</div>'+
  '<div class="settle-actions">'+
    '<div class="new-note-btn" style="flex:1;margin:0;" onclick="newNote()"><span>＋</span> 新建内容</div>'+
    '<button class="mgr-gear" onclick="openKCardsView()" title="知识库" style="padding:4px 7px;border:1px solid var(--border);border-radius:var(--rx);font-size:12px;">🧠</button>'+
    '<button class="mgr-gear" onclick="openCatManager()" title="管理类型" style="padding:4px 7px;border:1px solid var(--border);border-radius:var(--rx);font-size:12px;">⚙ 类型</button>'+
  '</div>';

  NOTE_CATS.forEach(function(cat){
    var items=S.notes.filter(function(n){return n.cat===cat.id;});
    if(!items.length)return;
    items.sort(function(a,b){return (b.updated||b.created||0)-(a.updated||a.created||0);});
    html+='<div class="cat-group">'+
      '<div class="cat-hd" onclick="toggleCat(this)">'+
        '<span class="cat-arrow open">▶</span>'+cat.icon+' '+cat.label+
      '</div>'+
      '<div class="cat-items">'+
      items.map(function(n){
        return'<div class="note-row'+(S.activeNoteId===n.id?' active':'')+'" onclick="openNote(\''+n.id+'\')">'+
          '<div class="note-dot"></div>'+
          '<div class="note-row-title">'+esc(n.title||'无标题')+'</div>'+
          '<div class="note-row-date">'+fmtDate(n.updated||n.created)+'</div>'+
        '</div>';
      }).join('')+
      '</div></div>';
  });
  el.innerHTML=html;
}

function filterSettle(query){
  var cats=document.querySelectorAll('#panel-body .cat-group');
  var q=query.toLowerCase();
  cats.forEach(function(cg){
    var rows=cg.querySelectorAll('.note-row');
    var any=false;
    rows.forEach(function(r){
      var txt=r.querySelector('.note-row-title').textContent.toLowerCase();
      var vis=!q||txt.includes(q);
      r.style.display=vis?'':'none';
      if(vis)any=true;
    });
    cg.style.display=any?'':'none';
  });
}

function toggleCat(hd){
  var arrow=hd.querySelector('.cat-arrow');
  var items=hd.nextElementSibling;
  var open=arrow.classList.contains('open');
  arrow.classList.toggle('open',!open);
  if(items)items.style.display=open?'none':'';
}

function newNote(){
  var n={id:uid(),cat:'notes',title:'',body:'',created:Date.now(),updated:Date.now()};
  S.notes.unshift(n);save();
  S.activeNoteId=n.id;
  renderPanel();
  openNote(n.id);
}

function openNote(id){
  var n=S.notes.find(function(x){return x.id===id;});if(!n)return;
  S.activeNoteId=id;
  var cat=NOTE_CATS.find(function(c){return c.id===n.cat;})||{label:'笔记',icon:'📝'};
  eid('tb-title').textContent=n.title||'无标题';
  eid('tb-sub').textContent=cat.icon+' '+cat.label+' · '+(fmtDate(n.updated||n.created)||'');
  eid('task-seg').style.display='none';
  eid('tb-add-btn').style.display='none';

  var ev=eid('view-note');
  ev.innerHTML='<div class="note-editor-wrap" style="padding:0 0 20px;">'+
    '<div class="ne-titlebar">'+
      '<input class="ne-title-inp" value="'+esc(n.title)+'" placeholder="标题..." oninput="updateNoteTitle(\''+id+'\',this.value)">'+
      '<select style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--rxs);padding:4px 8px;font-size:12px;color:var(--text2);outline:none;cursor:pointer;" onchange="updateNoteCat(\''+id+'\',this.value)">'+
        NOTE_CATS.map(function(c){return'<option value="'+c.id+'"'+(c.id===n.cat?' selected':'')+'>'+c.icon+' '+c.label+'</option>';}).join('')+
      '</select>'+
      '<button class="tc-act-btn del" onclick="deleteNote(\''+id+'\')" title="删除笔记" style="margin-left:4px">✕</button>'+
    '</div>'+
    '<div class="ne-meta">'+cat.icon+' '+cat.label+' · '+(n.updated?fmtDate(n.updated):'今天')+'</div>'+
    '<textarea class="ne-body" style="flex:1;min-height:400px;" oninput="updateNoteBody(\''+id+'\',this.value)">'+esc(n.body||'')+'</textarea>'+
  '</div>';
  showView('view-note');

  // update sidebar highlight
  document.querySelectorAll('.note-row').forEach(function(r){r.classList.remove('active');});
  var activeRow=document.querySelector('.note-row[onclick*="\''+id+'\'"]');
  if(activeRow)activeRow.classList.add('active');
}

function updateNoteTitle(id,val){
  var n=S.notes.find(function(x){return x.id===id;});
  if(!n)return;n.title=val;n.updated=Date.now();
  eid('tb-title').textContent=val||'无标题';
  clearTimeout(n._saveTimer);n._saveTimer=setTimeout(function(){save();renderSettlePanel(eid('panel-body'));},800);
}
function updateNoteBody(id,val){
  var n=S.notes.find(function(x){return x.id===id;});
  if(!n)return;n.body=val;n.updated=Date.now();
  clearTimeout(n._saveTimer2);n._saveTimer2=setTimeout(function(){save();},1000);
}
function updateNoteCat(id,cat){
  var n=S.notes.find(function(x){return x.id===id;});
  if(!n)return;n.cat=cat;n.updated=Date.now();save();
  renderSettlePanel(eid('panel-body'));
  var c=NOTE_CATS.find(function(c){return c.id===cat;})||{label:'笔记',icon:'📝'};
  eid('tb-sub').textContent=c.icon+' '+c.label+' · '+(fmtDate(n.updated||n.created)||'');
}
function deleteNote(id){
  if(!confirm('删除这篇笔记？'))return;
  S.notes=S.notes.filter(function(x){return x.id!==id;});
  S.deletedIds.push(id);save();
  S.activeNoteId=null;
  renderPanel();
  eid('tb-title').textContent='沉淀';eid('tb-sub').textContent='';
  showView('view-empty');
  toast('已删除');
}

function renderNoteMain(){
  if(S.activeNoteId)openNote(S.activeNoteId);
  else showView('view-empty');
}

function pickProjColor(c,el){

}
function submitNewProj(){
  var name=(eid('new-proj-name').value||'').trim();
  if(!name){toast('请填写项目名称');return;}
  var p={id:uid(),name:name,color:S._newProjColor,logs:[],created:Date.now()};
  S.projects.push(p);S.activeProjId=p.id;
  save();closeModal();renderProjMain();toast('项目已创建 ✓');

function deleteProj(id){
  if(!confirm('删除项目及所有日志？'))return;

  save();renderProjMain();toast('已删除');
}

function addLogKey(e,projId){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addLog(projId);}}
function addLog(projId){
  var inp=eid('add-log-inp');var body=inp.value.trim();if(!body)return;
  var p=S.projects.find(function(x){return x.id===projId;});if(!p)return;
  if(!p.logs)p.logs=[];
  var now=new Date();
  p.logs.push({id:uid(),body:body,date:pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes()),created:Date.now()});
  save();inp.value='';renderProjMain();
}
function deleteLog(projId,logId){
  var p=S.projects.find(function(x){return x.id===projId;});if(!p)return;
  p.logs=(p.logs||[]).filter(function(l){return l.id!==logId;});
  save();renderProjMain();
}

function saveSync(){
  var cfg={owner:(eid('cfg-owner').value||'').trim(),repo:(eid('cfg-repo').value||'').trim(),token:(eid('cfg-token').value||'').trim()};
  saveCfg(cfg);toast('已保存');renderSettings();
  if(isConfigured())ghPull().then(function(r){if(r===true){renderPanel();renderTaskMain();toast('已从云端加载 ✓');}else if(r==='notfound')ghPush();});
}
function clearSync(){if(!confirm('清除同步配置？'))return;saveCfg({});toast('已清除');renderSettings();}
function manualSync(){ghPull().then(function(r){if(r===true){renderPanel();renderTaskMain();toast('同步完成 ✓');}else ghPush();});}

function exportData(){
  var data=JSON.stringify({tasks:S.tasks,notes:S.notes,inbox:S.inbox,projects:S.projects,knowledge:S.knowledge,books:S.books,deletedIds:S.deletedIds},null,2);
  var a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
  a.download='workspace-export-'+todayStr().replace('/','.')+'.json';
  a.click();
}
function importDataPrompt(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(d.tasks){
          S.tasks=d.tasks||[];S.notes=d.notes||[];S.inbox=d.inbox||[];
          S.projects=d.projects||[];S.knowledge=d.knowledge||[];S.books=d.books||[];S.deletedIds=d.deletedIds||[];
          saveLocal();renderPanel();renderTaskMain();renderSettings();
          toast('导入成功 ✓');
        } else toast('文件格式不对');
      }catch(e2){toast('解析失败');}

  var prefs=buildAIPrefsContext();

/* ══════════════════════════════════════════
   AI CORE
══════════════════════════════════════════ */
async function askAI(prompt,systemPrompt,model){
  var cfg=getCfg();
  if(!cfg.dsKey)return null;
  var mdl=model||'deepseek-chat';
  try{
    var msgs=[];
    if(systemPrompt)msgs.push({role:'system',content:systemPrompt});
    msgs.push({role:'user',content:prompt});
    var res=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.dsKey},
      body:JSON.stringify({model:mdl,messages:msgs,max_tokens:800})
    });
    var data=await res.json();
    if(data.error){console.warn('AI error:',data.error);return null;}
    return data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||null;
  }catch(e){console.warn('askAI error:',e);return null;}
}
function saveAISettings(){
  var cfg=getCfg();
  cfg.dsKey=(eid('cfg-ds-key').value||'').trim();
  cfg.dsReviewModel=(eid('cfg-ds-review-model').value||'deepseek-v4-pro');
  saveCfg(cfg);toast('AI 设置已保存 ✓');
}
function buildAIPrefsContext(){
  try{
    var hist=JSON.parse(localStorage.getItem('ws_ai_feedback')||'[]');
    if(!hist.length)return'';
    var likes=hist.filter(function(x){return x.r==='love';}).map(function(x){return x.c;}).filter(Boolean).slice(-5);
    var dislikes=hist.filter(function(x){return x.r==='broken';}).map(function(x){return x.c;}).filter(Boolean).slice(-5);
    var out='';
    if(likes.length)out+='用户喜欢：'+likes.join('；')+'\n';
    if(dislikes.length)out+='用户不喜欢：'+dislikes.join('；');
    return out;
  }catch(e){return'';}
}
function buildAISystemPrompt(){
  var today=todayStr();
  var recentTasks=S.tasks.filter(function(t){return !t.isTemplate;}).slice(0,30);
  var recentReviews=S.reviews.slice(-14);
  var kcards=S.kcards.slice(0,20);
  var prefs=buildAIPrefsContext();
  var ctx='你是用户的私人AI助手，你了解他/她的工作台数据。\n\n';
  if(recentTasks.length)ctx+='近期任务（'+recentTasks.length+'条）：\n'+recentTasks.map(function(t){return'- ['+(t.done?'完成':'未完')+'] '+t.title+(t.date?' ('+t.date+')':'');}).join('\n')+'\n\n';
  if(recentReviews.length)ctx+='近期复盘（'+recentReviews.length+'条）：\n'+recentReviews.map(function(r){return r.date+': Q1='+r.q1+' Q2='+r.q2+' Q3='+r.q3+' 状态='+r.mood;}).join('\n')+'\n\n';
  if(kcards.length)ctx+='知识卡（'+kcards.length+'张）：\n'+kcards.map(function(c){return'- '+c.content.slice(0,60);}).join('\n')+'\n\n';
  if(prefs)ctx+='用户反馈偏好：\n'+prefs;
  return ctx;
}

function saveAIFeedbackNote(fbId){
  var note=eid('fbn-'+fbId);if(!note)return;
  var row=document.getElementById('fbr-'+fbId);
  var sel=row?row.querySelector('.ai-fb-btn.selected'):null;
  if(sel&&note.value.trim())_saveAIFeedback(fbId,sel.textContent==='❤️'?'love':'broken',note.value.trim());
}
function _saveAIFeedback(fbId,rating,comment){
  try{
    var hist=JSON.parse(localStorage.getItem('ws_ai_feedback')||'[]');
    var idx=hist.findIndex(function(x){return x.id===fbId;});
    var entry={id:fbId,r:rating,c:comment,t:Date.now()};
    if(idx>=0)hist[idx]=entry;else hist.push(entry);
    if(hist.length>200)hist=hist.slice(-200);
    localStorage.setItem('ws_ai_feedback',JSON.stringify(hist));
  }catch(e){}
}

/* ══ WEEKLY LETTER (周度信件) ══ */
function getWeekStart(d){
  var dt=d?new Date(d):new Date();
  var day=dt.getDay();
  var diff=(day===0?-6:1-day);
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return pad(dt.getFullYear())+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
}
function openLetterView(){
  S.navMode='home';
  eid('nav-letter-dot').classList.remove('on');
  eid('panel').style.display='none';
  eid('task-seg').style.display='none';
  eid('tb-add-btn').style.display='none';
  eid('tb-title').textContent='周度信件';
  eid('tb-sub').textContent='';
  showView('view-letter');
  S._letterIdx=0;
  renderLetterView();
}
function renderLetterView(){
  var el=eid('view-letter');if(!el)return;
  var letters=S.weeklyLetters.slice().reverse();
  var html='<div class="letter-wrap">';

  if(letters.length){
    html+='<div class="letter-week-nav">'+letters.map(function(l,i){
      return'<button class="letter-week-btn'+(i===S._letterIdx?' active':'')+'" onclick="S._letterIdx='+i+';renderLetterView()">'+l.weekLabel+'</button>';
    }).join('')+'</div>';
    var cur=letters[S._letterIdx];
    html+='<div class="letter-card">'+
      '<div class="letter-greeting">'+esc(cur.greeting||'你好 👋')+'</div>'+
      '<div class="letter-stats-row">'+
        '<div class="letter-stat"><div class="letter-stat-n">'+(cur.stats&&cur.stats.taskDone||0)+'</div><div class="letter-stat-l">任务完成</div></div>'+
        '<div class="letter-stat"><div class="letter-stat-n">'+(cur.stats&&cur.stats.reviewDays||0)+'</div><div class="letter-stat-l">复盘天数</div></div>'+
        '<div class="letter-stat"><div class="letter-stat-n">'+(cur.stats&&cur.stats.kcardNew||0)+'</div><div class="letter-stat-l">新知识卡</div></div>'+
      '</div>'+
      '<div class="letter-body-text">'+esc(cur.body||'')+'</div>'+
      renderAIFeedbackHtml('letter-'+cur.weekStart,cur.aiFeedback||null)+
    '</div>';
  } else {
    html+='<div class="letter-empty">'+
      '<div style="font-size:30px">📬</div>'+
      '<div>每周一早上自动生成本周信件</div>'+
      '<div style="font-size:12px;color:var(--text4)">坚持使用工作台，AI 会越来越了解你</div>'+
      (getCfg().dsKey?'<button class="letter-gen-btn" style="margin-top:12px" onclick="generateWeeklyLetter(true)">手动生成本周信件</button>':'<div style="font-size:11px;color:var(--text3)">（请先在设置中填写 AI Key）</div>')+
    '</div>';
  }
  html+='</div>';
  if(letters.length&&getCfg().dsKey){
    html+='<div style="margin-top:12px"><button class="letter-gen-btn" onclick="generateWeeklyLetter(false)">生成本周新信件</button></div>';
  }
  el.innerHTML=html;
}
async function generateWeeklyLetter(force){
  var cfg=getCfg();if(!cfg.dsKey){toast('请先填写 AI Key');return;}
  var ws=getWeekStart();
  var existing=S.weeklyLetters.find(function(l){return l.weekStart===ws;});
  if(existing&&!force){toast('本周信件已生成');return;}

  var weekEnd=new Date(ws);weekEnd.setDate(weekEnd.getDate()+6);
  var wsStr=ws;
  var weStr=pad(weekEnd.getFullYear())+'-'+pad(weekEnd.getMonth()+1)+'-'+pad(weekEnd.getDate());

  // 收集本周数据
  var weekTasks=S.tasks.filter(function(t){return t.date>=wsStr.slice(5).replace('-','/')&&t.date<=weStr.slice(5).replace('-','/');});
  var weekDone=weekTasks.filter(function(t){return t.done||t.status==='done';}).length;
  var weekReviews=S.reviews.filter(function(r){var d=r.date;return d>=wsStr.slice(5).replace('-','/')&&d<=weStr.slice(5).replace('-','/');});
  var weekKcards=S.kcards.filter(function(c){var d=new Date(c.created);var ds=pad(d.getMonth()+1)+'/'+pad(d.getDate());return ds>=wsStr.slice(5).replace('-','/')&&ds<=weStr.slice(5).replace('-','/');});

  var stats={taskDone:weekDone,taskTotal:weekTasks.length,reviewDays:weekReviews.length,kcardNew:weekKcards.length};

  toast('正在生成信件…');
  var prompt='请为用户写一封本周（'+wsStr+' ~ '+weStr+'）的个人周度信件。\n\n'+
    '本周数据：\n'+
    '- 任务完成 '+weekDone+'/'+weekTasks.length+' 个\n'+
    '- 复盘天数：'+weekReviews.length+' 天\n'+
    (weekReviews.length?'- 复盘摘要：'+weekReviews.map(function(r){return r.q1||r.q2||r.q3;}).filter(Boolean).slice(0,3).join('；')+'\n':'')+
    '- 新增知识卡：'+weekKcards.length+' 张\n\n'+
    buildAIPrefsContext()+'\n\n'+
    '要求：以叙述体写，像朋友给我写的一封信，温暖有洞察。150-250字。找出规律或值得关注的点。嵌入1-2个关键数字。第一行写问候语（如"Hi，这是你本周的回顾"），正文另起一段。不要分点列表。';

  var result=await askAI(prompt,'你是用户的私人AI，帮助写有温度的周度复盘信件。',cfg.dsReviewModel||'deepseek-v4-pro');
  if(!result){toast('生成失败，请检查 API Key');return;}

  var lines=result.split('\n').filter(function(l){return l.trim();});
  var greeting=lines[0]||'Hi，这是你本周的回顾 👋';
  var body=lines.slice(1).join('\n').trim()||result;

  var now=new Date();
  var wsLabel=(wsStr.slice(5))+' 这周';
  var letter={id:uid(),weekStart:ws,weekLabel:wsLabel,greeting:greeting,body:body,stats:stats,generated:Date.now()};

  var idx=S.weeklyLetters.findIndex(function(l){return l.weekStart===ws;});
  if(idx>=0)S.weeklyLetters[idx]=letter;else S.weeklyLetters.push(letter);
  save();S._letterIdx=0;renderLetterView();toast('信件已生成 ✓');
}
function checkAutoGenerateLetter(){
  if(!getCfg().dsKey)return;
  var now=new Date();
  if(now.getDay()!==1)return; // 只在周一触发
  var ws=getWeekStart();
  var existing=S.weeklyLetters.find(function(l){return l.weekStart===ws;});
  if(!existing){
    generateWeeklyLetter(false);
    eid('nav-letter-dot').classList.add('on');
  }
}

/* ══ AI CHAT ══ */
function toggleChatPanel(){
  var panel=eid('ai-chat-panel');
  panel.classList.toggle('on');
  if(panel.classList.contains('on')){
    positionChatPanel();
    if(!_aiChatMsgs.length)renderChatMsgs();
    setTimeout(function(){var i=eid('ai-chat-inp');if(i)i.focus();},100);
  }
}
function positionChatPanel(){
  var btn=eid('ai-float-btn');
  var panel=eid('ai-chat-panel');
  if(!btn||!panel)return;
  var bRect=btn.getBoundingClientRect();
  var pW=360,pH=Math.min(window.innerHeight*0.72,500);
  var left=bRect.left-pW+bRect.width;
  var top=bRect.top-pH-10;
  if(left<10)left=10;
  if(top<10)top=bRect.bottom+10;
  panel.style.left=left+'px';
  panel.style.top=top+'px';
  panel.style.bottom='auto';
  panel.style.right='auto';
}
function renderChatMsgs(){
  var el=eid('ai-chat-msgs');if(!el)return;
  if(!_aiChatMsgs.length){
    el.innerHTML='<div style="color:var(--text3);font-size:12px;text-align:center;padding:20px 0">你好！我了解你的任务、复盘和知识库，有什么想聊的？</div>';
    return;
  }
  el.innerHTML=_aiChatMsgs.map(function(m,i){
    if(m.role==='user')return'<div class="ai-msg-user"><div class="ai-bubble">'+esc(m.content)+'</div></div>';
    return'<div class="ai-msg-ai"><div class="ai-bubble">'+esc(m.content)+'</div>'+
      renderAIFeedbackHtml('chat-'+i,m.fb||null)+
    '</div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}
function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMsg();}}
async function sendChatMsg(){
  var inp=eid('ai-chat-inp');if(!inp)return;
  var text=inp.value.trim();if(!text)return;
  var cfg=getCfg();
  if(!cfg.dsKey){toast('请先在设置中填写 AI Key');return;}

  inp.value='';inp.style.height='auto';
  _aiChatMsgs.push({role:'user',content:text});
  renderChatMsgs();

  var btn=eid('ai-send-btn');if(btn)btn.disabled=true;
  // 加 loading 占位
  _aiChatMsgs.push({role:'assistant',content:'…'});
  renderChatMsgs();

  var sys=buildAISystemPrompt();
  // 构建多轮 messages（最近10轮）
  var histMsgs=_aiChatMsgs.slice(0,-1).slice(-20).map(function(m){return{role:m.role,content:m.content};});

  var result=await askAI(text,sys,'deepseek-chat');
  // 替换 loading
  _aiChatMsgs[_aiChatMsgs.length-1]={role:'assistant',content:result||'请求失败，请检查 API Key 或网络'};
  if(btn)btn.disabled=false;
  renderChatMsgs();
}
function initChatDrag(){
  var btn=eid('ai-float-btn');if(!btn)return;
  var posKey='ws_chat_btn_pos';
  try{var p=JSON.parse(localStorage.getItem(posKey)||'{}');if(p.right){btn.style.right=p.right+'px';btn.style.bottom=p.bottom+'px';btn.style.left='auto';btn.style.top='auto';}}catch(e){}

  btn.addEventListener('mousedown',function(e){
    e.preventDefault();
    _aiChatDragging=false;
    var startX=e.clientX,startY=e.clientY;
    var startRight=window.innerWidth-btn.getBoundingClientRect().right;
    var startBottom=window.innerHeight-btn.getBoundingClientRect().bottom;
    function onMove(e2){
      var dx=e2.clientX-startX,dy=e2.clientY-startY;
      if(Math.abs(dx)>4||Math.abs(dy)>4)_aiChatDragging=true;
      if(!_aiChatDragging)return;
      var nr=Math.max(10,startRight-dx);
      var nb=Math.max(10,startBottom-dy);
      btn.style.right=nr+'px';btn.style.bottom=nb+'px';btn.style.left='auto';btn.style.top='auto';
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      try{localStorage.setItem(posKey,JSON.stringify({right:parseInt(btn.style.right),bottom:parseInt(btn.style.bottom)}));}catch(e){}
      if(!_aiChatDragging)toggleChatPanel();
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // initial position
  if(!btn.style.right){btn.style.right='20px';btn.style.bottom='20px';}
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
function init(){
  loadLocal();
  // load tags
  try{var t=JSON.parse(localStorage.getItem('ws_tags'));if(t&&t.length)TAGS=t;}catch(e){}
  // load note cats from old v4 if available
  try{var nc=JSON.parse(localStorage.getItem('ws_note_cats_v2'));if(nc&&nc.length)NOTE_CATS=nc;}catch(e){}

  // 版本号显示
  document.title='工作台 '+VERSION;
  var vEl=eid('nav-version');if(vEl)vEl.textContent=VERSION;

  // file:// 检测
  if(location.protocol==='file:'){eid('file-warn').classList.add('on');}

  // 服务器检测（任何访问方式都检测）
  if(location.protocol!=='file:'){checkServer();}

  // render initial state
  navTo('home');
  initChatDrag();
  checkAutoGenerateLetter();

  // cloud sync
  if(isConfigured()){
    ghPull().then(function(r){
      if(r===true){renderPanel();renderTaskMain();}
      else if(r==='notfound')ghPush();
    });
  }
}

var _serverOk=false;
function checkServer(){
  fetch('/ping',{cache:'no-cache'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.ok){
        if(!_serverOk){
          _serverOk=true;
          eid('server-warn').classList.remove('on');
          var ok=eid('server-warn-ok');
          ok.classList.add('on');
          setTimeout(function(){ok.classList.remove('on');},2000);
        }
        setTimeout(checkServer,15000);
      } else { _serverFail(); }
    })
    .catch(function(){_serverFail();});
}
function _serverFail(){
  _serverOk=false;
  eid('server-warn').classList.add('on');
  eid('server-warn-ok').classList.remove('on');
  setTimeout(checkServer,3000);
}

init();
</script>
